body:
  text: 禪林寶訓序此書盛行於江北大著於吳中而閩粵師僧十有八九莫之見聞欲其禪林之振法道之隆詎可得乎余昔行脚雲棲目之如獲至寶懷之有年雖不能力行抑亦不敢須臾忽也然是集始自明教老人終于懶菴大師於中三百篇皆從諸老苦心中流出而其語言光明正大直截簡切真為萬世師法然則會易而行之誠難也貴乎剪華取實急救像季之流幣摧邪扶正恢復上古之真宗澆漓之風既息渾樸之道已全而口耳傳流之弊悖逆無根之說曷繇而興故余每欲刊行與眾共之所愧囊空弗克其事用是鳩諸同志剞劂流通大有補于閩倘遇血氣衲僧磕著一言半句將來蓋天蓋地奚愁乎禪林之不振法道之不隆非惟予之願已足亦不辜從上諸老口門放大寶光炤耀天下古今禪林之本懷也崇禎甲申春七十三衲如祐稽首拜錄禪林寶訓合註序寶訓其來久矣而合註者何邇見禪風盛希法化流行邪解蔓延正因淪溺山林乏主城市多端巧橫生荊榛肆出間有貸招提而沽勢位假賄賂而鬻名稱反𠷣坦直以世務不諳廼逞偏私以傲遊無忌如斯敝習後昆之典型安在末季之砥柱奚歸不至為明教嵩圓通訥諸大尊宿所訶者鮮矣況乎調御人才軌模先哲德言亟立義誨惟勤尤慮病足醫門鈍多鞴所若夫藏珠魚目襲玉碔砆寧禁瓦礫塞空駑駘載野者哉然而片長寸技雖錄上裁詎知敗種焦芽亦克掄選大抵邇志求合狹道苟容不思矩矱叢林匡扶佛祖無怪其弁視乎寶訓也淨慧居士傍觀有分一日持是集到慧雲謀之於余此可為今時濫汙者鑑即付木上座一任諸方檢點順治己丑年除夕前三日武林慧雲禪寺住持釋行盛譔禪林寶訓合註敘古德有云出家乃大丈夫事非將相之所能為夫功業被乎羣生勳名流乎奕世至于將相稱極盛矣而猶似不屑為則此所謂大丈夫者豈非全乎道德之風遠去凡陋之迹體高亮之弘姿挺孤奇之雅操上足以合乎佛心下足以拯乎含識確然足為人天師表照耀古今者乎乃去聖逾遠人心雕斵主者俯仰以取世資學人隨波而溷保社佛法下衰漸有江河之勢此妙喜竹菴二大士所以有寶訓之作也夫二師當程朱倡明儒學之日方容矩步所談者正心誠意所辨者義利公私其于釋氏真若宼讎然者然今觀所列自明教嵩而下諸大尊宿見地超卓踐履真實非惟僅能固其籓籬而已而又能使勳業若富鄭公趙清獻文名若蘇子瞻黃魯直道學若胡康侯張子韶其他名公鉅儒無慮數十百家莫不皈敬投誠入廛垂手即程子亦從而嘆曰三代禮樂盡于此矣朱子亦有言願盻指心性名言超有無其意雖欲折之而卒無瑕隙可指者則非特諸尊宿透悟之微宗風之盛足以杜其口即其臨事施為之際崇道德厲廉隅遠榮名抑利養光明正大實有以大服其心也向使趨炎附勢逐利鑽名或貢高我慢背蔑師友破碎大道紊亂先規問其名則巍然知識之稱而綜其實有出于庸俗之所羞為者亦何以紹隆佛種主持正法令世之賢人君子無所議其後乎即世或為所蒙蔽而清夜思之寧不內愧于心耶故夫二師是編扶衰起敝足與儒家近思錄諸篇相表裏誠釋門之龜鑑而衲子之楷模也歟顧其書雖行頗患殘缺乃東吳善師補綴于前而雲棲建師音義于後可謂全矣然音義雖具而獨本單行飜閱不便余故與弟程叔刪其繁蕪增其未備酌為定本各附註于本條之下以便觀覧惟願有志于為大丈夫者自學地以至于出世為人日手此一編以作韋弦之佩可也庚寅夏日武林淨慧居士張文嘉仲嘉甫述禪林寶訓序寶訓者昔妙喜竹菴誅茅江西雲門時共集予淳熈間遊雲居得之老僧祖安惜其年深蠧損首尾不完後來或見于語錄傳記中積之十年僅五十篇餘仍取黃龍下至佛照簡堂諸老遺語節葺類三百篇其所得有先後而不以古今為詮次大槩使學者削勢利人我趨道德仁義而已其文理優游平易無高誕荒邈詭異之跡實可以助入道之遠猷也且將刊木以廣流傳必有同志之士一見而心許者予雖老死丘壑而志願足矣東吳沙門淨善書妙喜妙喜者臨安府徑山宗杲大慧普覺禪師江東宣州寧國奚氏子嗣佛果克勤禪師南嶽下十五世十三入校不樂世典詣東山慧雲院惠濟禪師十七落髮披緇後入雲居之西古雲門寺之舊基誅茅結菴經二十年辟地湖湘轉仰山邂逅竹菴珪禪師相與著頌古百餘篇此寶訓是其時集也竹菴溫州龍翔竹菴士珪禪師成都府史氏子嗣佛眼清遠禪師南嶽下十五世也誅茅誅茅者斬草也謂誅斬茅草結菴隱居也淳熈淳熈宋孝宗年號祖菴未詳氏族法嗣黃龍隆興府黃龍惠南禪師信州張氏子嗣石霜楚圓南嶽下十一世也佛照慶元府即明州育王寺德光佛照拙菴禪師臨江郡彭氏子嗣大慧宗杲禪師南嶽下十六世依本郡東山華光寺吉禪師祝髮後來孝宗淳熈三年十一月詔入選德殿談禪淳熈五年賜佛照號達於天下宗風大振也簡堂台州國清寺簡堂行機禪師本郡楊氏子嗣護國景元禪師南嶽下十六世也東吳沙門淨善東吳蘇州郡名沙門略梵謂也全謂沙迦門曩此云勤息謂勤行善法自滅諸惡淨善乃序主諱後學不可雙稱當曰上淨下善也
