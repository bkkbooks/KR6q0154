body:
  text: 虎林澄遠居士張文憲程叔甫參閲佛智和尚曰駿馬之奔逸而不敢肆足者銜轡之禦也小人之強橫不敢縱情者刑法之制也意識之流浪不敢攀緣者覺照之力也烏乎學者無覺照猶駿馬無銜轡小人無刑法將何以絶貪欲治妄想乎與鄭居士法語禦制也佛智謂水菴曰住持之體有四焉一道德二言行三仁義四禮法道德言行乃教之本也仁義禮法乃教之末也無本不能立無末不能成先聖見學者不能自治故建叢林以安之立住持以統之然則叢林之尊非為住持四事豐美非為學者皆以佛祖之道故是以善為住持者必先尊道德守言行能為學者必先存仁義遵禮法故住持非學者不立學者非住持不成住持與學者猶身之與臂頭之與足大小適稱而不悖乃相須而行也故曰學者保於叢林叢林保於道德住持人無道德則叢林將見其廢矣實録水菴一和尚曰易言君子思患而預防之是故古之人思生死大患防之以道遂能經大傳遠今之人謂求道迂濶不若求利之切當由是競習浮華計較毫末希目前之事懷苟且之計所以莫肯為周歲之規者況生死之慮乎所以學者日鄙叢林日廢紀綱日墜以至陵夷顛沛殆不可救嗟乎可不鑑哉雙林實録迂遠也陵夷上小山也下平也言丘陵潰墮漸至於地教化漸廢以類此也水菴曰昔遊雲居見高菴夜參謂至道徑挺不近人情要須誠心正意勿事矯飾偏邪矯飾則近詐偏邪則不中正與至道皆不合矣竊思其言近理乃刻意踐之逮見佛智先師始浩然大徹方得不負平生行腳之志與月堂書徑挺當機直指絶無回避擬議之間白雲千里水菴曰月堂住持所至以行道為己任不發化主不事登謁每歲食指隨常住所得用之衲子有志充化導者多却之或曰佛戒比丘持鉢以資身命師何拒之弗容月堂曰我佛在日則可恐今日為之必有好利者而至於自鬻矣因思月堂防微杜漸深切著明稱實之言今猶在耳以今日觀之又豈止自鬻而已矣法語月堂臨安府淨慈月堂道昌禪師潮州寶溪吳氏子嗣妙湛惠禪師風山漸卦漸漸進之義象曰山上有木漸君子以居賢德善俗注云二者皆當以漸而進賢字衍唐丘志曰居安慮危防微杜漸此古人憂之深慮之遠而防其未然也鬻賣也水菴謂侍郎尤延之曰昔大愚慈明谷泉琅琊結伴參汾陽河東苦寒衆人憚之惟慈明志在於道曉夕不殆夜坐欲睡引錐自刺歎曰古人為生死事大不食不寢我何人哉而縱荒逸生無益於時死無聞於後是自棄也一旦辭歸汾陽歎曰楚圓今去吾道東矣西湖記聞尤延之姓尤名袤字延之號遂初居士問道於水菴一禪師荒逸恣情放意怠惰荒淫流蕩無返也水菴曰古德住持率己行道未嘗苟簡自恣昔汾陽每歎像季澆漓學者難化慈明曰甚易所患主法者不能善導耳汾陽曰古人淳誠尚且三二十年方得成辦慈明曰此非聖哲之論善造道者千日之功或謂慈明妄誕不聽而汾地多冷因罷夜參有異比丘謂汾陽曰會中有大士六人奈何不説法不三年果有六人成道者汾陽嘗有頌曰胡僧金錫光請法到汾陽六人成大器勸請為敷揚西湖記聞及僧傳苟簡苟求聲利簡去仁義六人慈明圓大愚芝琅琊覺谷泉道法華舉天勝泰投子清和尚畫水菴像求贊曰嗣清禪人孤硬無敵晨昏一齋脅不至席深入禪定離出入息名達九重談禪選德龍顏大悅賜以金帛力辭者三上乃嘉歎真道人也草木騰煥傳豫陋質炷香請贊是所謂青出於藍而青於藍者也見畫像投子舒州投子山義清禪師嗣水菴一禪師南嶽下十七世也九重天子之門有九重也選德乃內宮殿名也上人君即位後皆稱上此乃指宋孝宗也青出於藍出荀子勸學篇青色乃由藍中之靛而染之其色返深於藍弟子學不止而勝於師乃末勝本也水菴曰佛智先師言東山演祖嘗謂耿龍學曰山僧有圓悟如魚之有水鳥之有翼故丞相紫巖居士贊曰師資相可希遇一時始終之分誰能間之紫巖居士可謂知言矣比見諸方尊宿懷心術以御衲子衲子挾勢利以事尊宿主賓交利上下欺侮安得法門之興叢林之盛乎與梅山潤書如魚有水劉玄德得武侯雲長翼德皆不悅玄德乃云孤之有孔明猶魚之有水也願君請無復言重孔明以曉二人也紫巖居士張浚字德遠號紫巖居士紹興初拜封為和國公問道於圓悟勤禪師師資師者人之模範為人之長訓物之規資者助也助發己身之行業又師以道傳於弟子弟子資學於師也水菴曰動人以言惟要真切言不真切所感必淺人誰肯懷昔白雲師祖送師翁住四面叮嚀曰祖道凌遲危如纍卵毋恣荒逸虗喪光陰復敗至德當寬容量度利物存衆提持此事報佛祖恩當時聞者孰不感慟爾昨來召對宸庭誠為法門之幸切宜下身尊道以利濟為心不可矜己自伐從上先哲謙柔敬畏保身全德不以勢位為榮遂能清振一時美流萬世豫慮光景不長無復面會故此切囑見投子書纍卵晉靈公建九層之臺三年不起有臣荀息諫曰臣能纍十二棊子又加九卵在其上公曰危哉息曰不危公造九層之臺三年不成男不耕女不織其危甚矣公聞之遂止也毋音無禁止之辭宸庭即遷德殿乃天子北辰之宮也伐誇也水菴少倜儻有大志尚氣節不事浮靡不循細檢胸次岸谷徇身以義雖禍害交前不見有殞穫之色住持八院經歷四郡所至兢兢業業以行道建立為心淳熙五年退西湖淨慈有偈曰六年灑掃皇都寺瓦礫翻成釋梵宮今日宮成歸去也杖頭八面起清風士庶遮留不止小舟至秀之天寧未幾示疾別衆告終行實倜儻上音剔窮而不變也下音倘卓異貌謂雅致慷慨瀟灑無羈也岸谷岸露額也谷兩山間流道蓋胸次沖虗如高岸空谷有容川之量徇以身逐物曰徇殞穫儒行篇云不殞穫於貧賤注云如蘀殞而飄零似禾穫而枯稿也又殞者如有所墜穫者如有所割刈也乃困迫失志之貌秀之天寧嘉興府秀水縣天寧寺也月堂昌和尚曰昔大智禪師慮末世比丘驕惰特製規矩以防之隨其器能各設攸司主居丈室衆居通堂列十局頭首之嚴肅如官府居上者提其大綱在下者理其衆目使上下相承如身之使臂臂之使指莫不率從是以前輩遵承翼戴拳拳奉行者以先聖之遺風未泯故也比見叢林衰替學者貴通才賤守節尚浮華薄真素日滋月浸漸入澆漓始則偷安一時及玩習既久謂其理之當然不謂之非義不謂之非理在上者惴惴焉畏其下在下者睽睽焉伺其上平居則甘言屈體以相媚悅得間則狠心詭計以相屠獪成者為賢敗者為愚不復問尊卑之序是非之理彼既為之此則效之下既言之上則從之前既行之後則襲之烏乎非彥聖之師乘願力積百年之功其弊固則莫能革矣與舜和尚書攸司所主掌也十局頭今十局即百丈清規中兩序要也餘不預焉謂而堂首座書記藏主知客都管監寺副寺維那典座也翼戴上恭敬也下頂戴也拳拳勤而奉持惴惴之瑞切憂也睽音奎斜視也屠獪宰殺曰屠殺戮曰獪又害也襲合也月堂住淨慈最久或謂和尚行道經年門下未聞有弟子得不辜妙湛乎月堂不對他日再言之月堂曰子不聞昔人種瓜而愛甚者盛夏之日方中而灌之瓜不旋踵而淤敗何也其愛之非不勤然灌之不以時適所以敗之也諸方老宿提挈衲子不觀其道業內充才器宏遠止欲速其為人逮審其道德則淫汙察其言行則乖戾謂其公正則邪得非愛之過其分乎是正猶日中之灌瓜也豫深恐識者笑故不為也北山記聞妙湛福州雪峰妙湛思惠禪師錢塘俞氏子嗣法雲善本禪師月堂曰黃龍居積翠因病三月不出真淨宵夜懇禱以至然頂煉臂仰祈陰相黃龍聞之責曰生死固吾分也爾參禪不達理若是真淨從容對曰叢林可無克文不可無和尚識者謂真淨敬師重法其誠至此他日必成大器北山記聞月堂曰黃太史魯直嘗言黃龍南禪師器量深厚不為事物所遷平生無矯飾門弟子有終身不見其喜怒者雖走使致力之輩一以誠待之故能不動聲氣而起慈明之道非苟然也一本見黃龍石刻月堂曰建炎己酉上巳日鍾相叛於澧陽文殊導禪師厄於難賊勢既盛其徒逸去師曰禍可避乎即毅然處於丈室竟為賊所害無垢居士拔其法語曰夫愛生惡死人之常情惟至人悟其本不生雖生而無所愛達其未嘗滅雖死而無所畏故能臨死生禍患之際而不移其所守師其人乎以師道德節義足以教化叢林垂範後世師名正導眉州丹稜人佛鑒之嗣也一本見廬山嶽府惠大師記聞建炎宋高宗年號上巳日即三月三日也鍾相紹興五年洞庭湖賊鍾相作亂傷殘人民得張俊官兵鍾相敗死不數日客商來往居民耕植鍾相號天皇大王澧陽湖廣常德府澧陽州是也文殊導常德府文殊心導禪師眉州徐氏子嗣佛鑑勤禪師十三得度詣都習唯識論自以為至得同學詰曰三界唯心萬法唯識今目前萬象摐然心識安在師無對由是周遊江淮得法後應世住文殊寺宋高宗建炎三年春示衆舉臨濟臨滅囑三聖因緣曰正法眼藏瞎驢滅臨濟何曾有此説古今時人皆妄傳不信但看後三月果至後三月鍾相叛於澧陽其徒欲與師南奔師曰學道所以了生死何得避之俄然賊至師曰速然見殺快汝心意賊舉槊殘之血皆白乳賊驚駭引席覆而去毅音義果敢也端也至人行到之人又聖人也丹稜即四川眉州丹稜縣心聞賁和尚曰衲子因禪致病者多有病在耳目者以瞪眉努目側耳點頭為禪有病在口舌者以顛言倒語胡喝亂喝為禪有病在手足者以進前退後指東劃西為禪有病在心腹者以窮玄究妙超情離見為禪據實而論無非是病惟本色宗師明察幾微目擊而知其會不會入門而辨其到不到然後用一錐一劄脫其廉纖攻其搭滯驗其真假定其虗實而不守一方便昧乎變通俾終踏於安樂無事之境而後已矣實録心聞台州萬年寺心聞雲賁禪師永嘉人嗣育王介諶禪師南嶽下十六世也瞪音撑直視也劃音獲以刀破物也劄竹洽切刺也搭滯凝止不脫也言未得徹證猶有疑礙今用一錐一劄使其超然默契本心不存凡聖廓落無依縱橫自在而已心聞曰古云千人之秀曰英萬人之英曰傑衲子有智行聞於叢林者豈非近英傑之士邪但能勤而參究去虗取實各得其用則院無大小衆無多寡皆從其化矣昔風穴之白丁藥山之牛欄常公之大梅慈明之荊楚當此之時悠悠之徒若以位貌相求必見而詒之一旦據師席登華座萬指圍繞發明佛祖叔世之光明叢林孰不望風而靡矧前輩皆負瓌偉之材英傑之氣尚能區區於未遇之際含耻忍垢混世同波而若是況降茲者歟烏乎古猶今也此猶彼也若必待藥山風穴而師之千載一遇也若必待大梅慈明而友之百世一出也蓋事有從微而至著功有積小而成大未見不學而有成不修而先達者若悟此理師可求友可擇道可學德可修則天下之事何施而不可古云知人誠難聖人所病況其他乎與竹菴書風穴汝州風穴延沼禪師錢唐餘杭劉氏子嗣南院惠顒禪師南嶽下七世也白丁地名地多小人風穴隱匿數年未知孰是大梅明州大梅山法常禪師襄陽鄭氏子嗣馬祖後隱居於大梅悠悠優也尋常遊行之人詒音移慢也欺也叔季也末法之時也靡偃也歸也矧音審況也瓌偉上公回切玉美也下音葦乃奇大也心聞曰教外別傳之道至簡至要初無它説前輩行之不疑守之不易天禧間雪竇以辨博之才美意變弄求新琢巧繼汾陽為頌古籠絡當世學者宗風由此一變矣逮宣政間圓悟又出己意離之為碧巖集彼時邁古淳全之士如寧道者死心靈源佛鑒諸老皆莫能回其説於是新進後生珍重其語朝誦暮習謂之至學莫有悟其非者痛哉學者之心術壞矣紹興初佛日入閩見學者牽之不返日馳月騖浸漬成弊即碎其板闢其説以至祛迷援溺剔繁撥劇摧邪顯正特然而振之衲子稍知其非而不復慕然非佛日高明遠見乘悲願力救末法之弊則叢林大有可畏者矣與張子韶書下出廣録天禧宋真宗年號籠絡如鳥之在籠馬著羈絡不能脫去學者溺之亦猶是也宣政宋徽宗年號碧巖集山名圓悟禪師在此作評唱釋雪竇頌古為碧巖集也寧道者潭州開福道寧禪師歙溪汪氏子嗣五祖演禪師南嶽下十四世也紹興宋高宗年號佛日即妙喜也騖音務奔也漬音自浸潤也祛除却也劇增也尤甚也拙菴佛照光和尚初參雪堂於薦福有相者一見而器之謂雪堂曰衆中光上座頭顱方正廣顙豐七處平滿他日必為帝王師孝宗皇帝淳熙初召對稱旨留內觀堂七宿待遇優異度越前來賜佛照之名聞于天下記聞拙菴慶元府育王山佛照德光禪師臨江軍彭氏子嗣大慧杲禪師南嶽下十六世顱頂骨顙額也頷也七處兩手兩足兩眉及頂拙菴謂虞允文丞相曰大道洞然本無愚智譬如伊呂起於耕漁為帝王師詎可以智愚階級而能擬哉雜然非大丈夫其孰能與焉虞允文姓虞名允文字彬甫幼十歲時善賦詩詞有驚人之語後孝宗為相置翹材館舍以筵四方賢士伊尹姓伊名尹傷中國無賢君歎斯道不行隱耕於有莘之野湯三往聘之拜為相呂望東海人姓薑名尚字子牙釣魚磻溪之寶雞縣西伯將出獵卜之曰所獲者非熊非羆非虎非彪霸王之輔果獲薑尚於渭水之陽與語大悅曰自吾先君太公嘗云當有聖人適周太公望子久矣故號太公望立為師封為呂後佐武王伐紂階級上階梯也下次第也拙菴曰璇野菴常言黃龍南禪師寬厚忠信恭而慈愛量度凝遠博學洽聞常同雲峰悅遊湖湘避雨樹下悅箕踞相對南獨危坐悅瞋目視之曰佛祖妙道不是三家村古廟裏土地作死模樣南稽首謝之危坐愈甚故黃太史魯直稱之曰南公動靜不忘恭敬真叢林主也幻菴集箕踞長伸兩足以兩手按兩膝上其形似箕唐詩云緑樹陰濃足四鄰青苔日厚自無塵科頭箕踞長松下白眼看他世上人拙菴曰率身臨衆要以智遣妄除情須先覺背覺合塵則心蒙蔽矣智愚不分則事紊亂矣晝監寺書拙菴曰佛鑑住太平高菴充維那高菴齒少氣豪下視諸方少有可其意者一日齋時鳴楗見行者別器置食于佛鑑前高菴出堂勵聲曰五百僧善知識作遮般去就何以範模後學佛鑑如不聞見逮下堂詢之乃水齎菜蓋佛鑑素有脾疾不食油故高菴有愧詣方丈告退佛鑑曰維那所言甚當緣惠勤病乃爾嘗聞聖人言以理通諸礙所食既不優於衆遂不疑也維那志氣明遠他日當柱石宗門幸勿以此芥蒂逮佛鑑遷智海高菴過龍門後為佛眼之嗣楗所擊之物也鐘磬板木魚等物凡擊之有聲者皆名為楗柱石漢田延年謂霍光曰將軍為國柱石今謂柱石者欲撑拄宗門令法久住也芥蒂上音介下音瘥望人豁略曰幸勿芥蒂又刺鯁也鯁者骨不下咽也古謂蹇諤直言為骨鯁也直言難受如鯁骨留咽也拙菴曰大凡與官員論道酬酢須是剗去知解勿令他坐在窠窟裏直要單明向上一著子妙喜先師嘗言士大夫相見有問即對無問即不可又須是個中人始得此語有補於時不傷住持之體切宜思之與興化普菴書剗削也謂去其疑執斷其情思也拙菴曰地之美者善養物主之仁者善養士今稱住持者多不以衆人為心急己所欲惡聞善言好蔽過惡恣行邪行從快一時之意返被小人就其好惡取之則住持之道安得不危乎與洪老書拙菴謂野菴曰丞相紫巖居士言妙喜先師平生以道德節義勇敢為先可親不可疏可近不可迫可殺不可辱居處不淫飲食不溽臨生死禍患視之如無正所謂干將鏌鎁難與爭鋒但虞傷闕耳後如紫巖之言幻菴記聞可親下三句出孔子家語儒行篇淫溽禮記云居家不淫飲食不溽注淫流蕩也恣縱貪味曰溽也干將鏌鎁二良劍名按孝子傳云楚王夫人夏乘涼抱鐵柱感孕産生一鐵塊楚王令干將造劍三年乃成雙劍一雌一雄干將密將雄劍以匿進雌劍王祕匣中嘗聞悲鳴王問羣臣臣曰劍有雌雄鳴者憶雄耳王大怒干將知罪必死將劍藏於屋柱中囑妻鏌鎁曰日出北戶南山有松松生於石劍在其中妻後生男名眉間赤年十五歲問母曰吾父何在母述前事思惟剖柱果得其劍欲為父報讐楚王知之勑令覓得其人當厚賞之眉間赤遂逃俄有客曰子莫非眉間赤否曰然客曰吾甑山人能為子報父讐赤曰父昔無辜枉被荼毒君今見惠當何所須客曰當得子頭并劍赤乃自刎其頭客得其頭并劍進與楚王王曰大幸客曰願將此頭以油烹之王遂與頭投鼎烹至三日不爛客請王視客以劍揮王頭落於鼎中二頭相齧客恐眉間赤頭不勝乃自刎頭助之三頭相齧俄頃俱爛虞憂慮也闕損失也拙菴曰野菴住持通人情之始終明叢林之大體嘗謂豫言為一方主者須擇有志行衲子相與毗贊猶髮之有梳面之有鑑則利病好醜不可得而隱矣如慈明得楊岐馬祖得百丈以水投水莫之逆也幻菴集拙菴曰末學膚受徒貴耳賤目終莫能究其奧妙故曰山不厭高中有重巖積翠海不厭深內有四溟九淵欲究大道要在窮其高深然後可以照燭幽微應變不窮矣與覲老書末學膚受東京賦云末學膚受貴耳賤目注膚皮膚也皮膚之受故云膚受也此外受淺薄非內實所受貴於耳賤於目也溟淵上水之黑色也以東西南北四海為四溟下深也海有九轉回水漩澓其水至深故為九淵拙菴謂尤侍郎曰聖賢之意含緩而理明優遊而事顯所用之事不期以速成而許以持久不許以必進而許以庶幾用是推聖賢之意故能亘萬世而持之無過失者乃爾幻菴集庶幾從容審察也亘通也侍郎尤公曰祖師已前無住持事其後應世行道迫不得已然居則蓬蓽取蔽風雨食則粗糲取充飢餒辛苦憔悴有不堪其憂而王公大人至有願見而不可得者故其所建立皆磊磊落落驚天動地後世不然高堂廣廈美衣豐食指如意於是波旬之徒始洋洋然動其心趦趄權門搖尾乞憐甚者巧取豪奪如正晝攫金不復知世間有因果事妙喜此書豈特為博山設其拈盡諸方自來習氣不遺毫髮如飲倉公上池之水洞見肝腑若能信受奉行安用別求佛法見靈隱石刻蓬蓽織荊為門也禮記儒行篇曰儒有一畒之官環堵之室蓽門圭竇蓬戶甕牗憔悴枯瘦也憂勞也磊落如衆石之崩落而無阻滯皆大人之相無物滯於胸中如干戈叢裏橫身直過荊棘林中撬手便行腳跟下無五色線舌頭上無十字關鼻端無泥痕眼中無金屑故也指但動而指麾不勞用力皆如意也洋洋流蕩之貌趦趄上音咨下音菹欲趣而不行也攫金上爪持也列子云昔齊人有欲金者清旦衣冠之市適鬻金之所竊金而去金主捕之曰人皆在焉子何攫人之金答曰取金之時不見其人而獨見其金言人貪其利而忘其耻見其利而忘其害也上池之水古史云蘆越之東有扁鵲姓秦名緩渤海郡人少時為舍長客長桑君見扁鵲獨奇常勤遇之出入十餘年一日呼扁鵲私坐間語之曰我有藥方年將老矣欲傳與公公無泄漏鵲敬諾遂出懷中藥方與之示以上池水服之三七日當見物矣盡取方以授之忽不見其人也鵲如其言以藥水服之三七日視垣外一方人後視病盡見五臟癥結持以疹脈名耳注水未至於地承取竹木上露水故名上池之水侍郎尤公謂拙菴曰昔妙喜中興臨濟之道於凋零之秋而性尚謙虗未嘗馳騁見理平生不趨權勢不苟利養嘗曰萬事不可佚豫為不可奢態持蓋有利於時而便於物者有其過而無其功者若縱之奢佚則不濟矣不肖佩服斯言遂為終身之戒老師昨者遭遇主上留宿觀堂實為佛法之幸切冀不倦悲願使進善之途開明任衆之道益大庶幾後生晚輩不謀近習各懷遠圖豈不為叢林之利濟乎然侍者記聞中興廢而復興曰中興如周宣王漢光武中興帝王之業也佚豫縱意悅情而為態美意也便利也圖謀也密菴傑和尚曰叢林興衰在於禮法學者美惡在乎俗習使古之人巢居穴處澗飲木食行之於今時則不可也使今之人豐衣文采飯梁囓肥行之於古時亦不可也安有他哉習不習故夫人朝夕見者為常必謂天下事正宜如此一旦驅之就彼去此非獨生疑而不信將恐亦不從矣用是觀之人情安於所習駭其未見是其常情又何足怪與施司諫書密菴慶元府天童密菴咸傑禪師福州鄭氏子嗣應菴華禪師南嶽下十七世密菴謂悟首座曰叢林中惟浙人輕懦少立子之才器宏大量度淵容志尚端確加以見地穩密他日未易言但自韜晦無露圭角毀方瓦合持以中道勿為勢利少枉即是不出塵勞而作佛事也與笑菴書懦弱也韜晦韜藏虗名而棄華務實晦隱其迹而和光同塵也毀方瓦合禮記儒行篇曰儒有博學而不窮篤行而不惓乃慕賢而容衆毀方而瓦合寬有如此者略注云毀方瓦合者陶瓦之事其初則圓剖而為四其形則方毀其圓以為方合其方而為圓蓋於涵容之中未嘗無分辨故曰寬有如此者也密菴曰應菴先師嘗言賢不肖相反不得不擇賢者持道德仁義以立身不肖者專勢利詐以用事賢者得志必行其所學不肖者處位多擅私心妬賢嫉能嗜欲苟財靡所不至是故得賢則叢林興用不肖則廢有一于斯必不能安靜見嶽和尚書嫉妬殉自名利不耐他榮曰嫉妬又害賢曰嫉忌色曰妬密菴曰住持有三莫事繁莫懼無事莫尋是非莫辨住持人達此三事則不被外物所惑矣慧侍者記聞密菴曰衲子履行傾邪素有不善之迹者叢林互知此不足疾惟衆人謂之賢而內實不肖者誠可疾也與普慈書密菴謂水菴曰人有毀辱當順受之詎可輕聽聲言妄陳管見大率便有類邪巧多方懷險詖者好逞私心起猜忌者偏廢公議蓋此輩趨尚狹促所見暗短固以自異為不羣以沮議為出衆然既知我所用終是而毀謗固自在彼久而自明不須別白亦不必主我之是而訐觸於人則庶可以為林下人也與水菴書管見小見也如管窺天能見多許此言識見暗短而無高明遠大之見者險詖不平諂詐之言猜忌心多疑曰猜意多憎曰忌沮壞也止遏也訐攻發人之陰私曰訐自得輝和尚曰大凡衲子誠而向正雖愚亦可用而懷邪雖智終為害大率林下人操心不正雖有才能而終不可立矣見簡堂書自得輝杭州淨慈自得慧輝禪師會稽張氏子嗣天童正覺禪師自得曰大智禪師特創清規扶救末法比丘不正之弊由是前賢遵承拳拳奉行有教化有條理有始終紹興之末叢林尚有老成者能守典刑不敢斯須而去左右近年以來失其宗緒綱不綱紀不紀雖有綱紀安得而正諸故曰舉一綱則衆目張弛一機則萬事隳殆乎綱紀不振叢林不興惟古人體本以正末但憂法度之不嚴不憂學者之失所其所正在於公今諸方主者以私混公以末正本上者苟利不以道下者賊利不以義上下謬亂賓主混淆安得衲子向正而叢林之興乎與尤侍郎書弛音豸壞也隳毀壞也賊私取也自得曰良玉未剖瓦石無異名驥未馳駑駘相雜逮其剖而瑩之馳而試之則玉石駑驥分矣夫衲子之賢德而未用也混於稠人之中竟何辨別要在高明之士以公論舉之任以職事驗以才能責以成務則與庸流迥然不同矣與或菴書駑駘鈍馬也瑩玉之光也或菴體和尚初參此菴元布袋於天台護國因上堂舉龐馬選佛頌至此是選佛場之句此菴喝之或菴大悟有投機頌曰商量極處見題目途路窮邊入試場拈起毫端風雨快遮回不作探花郎自此匿迹天台丞相錢公慕其為人乃以天封招提勉令應世或菴聞之曰我不解懸羊頭賣狗肉也即宵遁去或菴鎮江府焦山或菴禪師台州羅氏子嗣護國景元禪師南嶽下十六世也選佛頌龐居士問馬祖不與萬法為侶者是甚麼人祖云待汝一口吸盡西江水即向汝道居士豁然大悟呈偈曰十方同聚會個個學無為此是選佛場心空及第歸錢公宋丞相姓錢名相祖字象先問道於或菴體禪師解會也遁隱藏也乾道初瞎堂住國清因見或菴讚圓通像曰不依本分惱亂衆生瞻之仰之有眼如盲長安風月貫今昔那個男兒摸壁行瞎堂驚喜曰不謂此菴有此兒即遍索之遂得於江心固於稠人中請充第一座天台野録乾道宋孝宗年號瞎堂臨安府靈隱寺瞎堂慧遠禪師眉山彭氏子嗣圓悟勤禪師或菴乾道初翩然訪瞎堂於虎丘姑蘇道俗聞其高風即詣郡舉請住城中覺報或菴聞之曰此菴先師囑我他日逢老壽止今若合符契矣遂欣然應命蓋覺報舊名老壽菴也虎丘記聞翩孤鳥疾飛之貌又自如也或菴入院後施主請小參曰道常然而不渝事有弊而必變昔江西南嶽諸祖若稽古為訓考其當否持以中道務合人心以悟為則所以素風凌然逮今未泯若約衲僧門下言前薦得屈我宗風句下分明沈埋佛祖雖然如是行到水窮處坐看雲起時由是緇素喜所未聞歸者如市語録異此凌然超越也或菴既領住持士庶翕然來歸衲子傳至虎丘瞎堂曰遮個山蠻杜拗子放拍盲禪治你那一隊野狐精或菴聞之以偈答曰山蠻杜拗得能憎領衆匡徒似不曾越格倒拈苕菷柄拍盲禪治野狐僧瞪堂笑而已記聞翕如鳥之聚也杜拗不依軌轍曰杜不順人情曰拗拍拊也自不能行拍人肩而行之隊羣也匡正也或菴謂侍郎曾公逮曰學道之要如衡石之定物持其平而已偏重可乎推前近後其偏一也明此可學道矣見曾公書或菴曰道德乃叢林之本衲子乃道德之本住持人棄厭衲子是忘道德也道德既忘將何以修教化整叢林誘來學古人體本以正末憂道德之不行不憂叢林之失所故曰叢林保於衲子衲子保於道德住持無道德則叢林廢矣見簡堂書或菴曰夫為善知識要在知賢不在自賢故傷賢者愚蔽賢者暗嫉賢者短得一身之榮不如得一世之名得一世之名不如得一賢衲子使後學有師叢林有主也與圖極書一賢衲子如國得一賢臣則興國治邦法門得一賢衲子則叢林永賴或菴遷焦山之三載實淳熙六年八月四日也先示微恙即手書并硯一隻別郡守侍郎曾公逮至中夜化去公以偈悼之曰翩翩隻履逐西風一物渾無布袋中留下陶泓將底用老夫無筆判虗空行狀悼挽也哀而至痛陶泓泓寶泓石泓涵星泓皆硯之別名也底何也無筆老師一段光明猶若虗空無筆可判也瞎堂遠和尚謂或菴曰人之才器自有大小誠不可教故楮小者不可懷大綆短者不可汲深鴟鵂夜撮蚤察秋毫晝出瞋目之不見丘山蓋分定也昔靜南堂傳東山之道頴悟幽奧深切著明逮應世住持所至不振圓悟先師歸蜀同範和尚訪之大隨見靜率略凡百弛廢先師終不問回至中路範曰靜與公為同參道友無一言啓迪之何也先師曰應世臨衆要在法令為先法令之行在其智能能與不能以其素分豈可教也範頷之虎丘記聞楮楮皮蔡倫將此而作紙也綆音梗取水之繩訓言楮小不可懷大綆短不可汲深此二句出莊子至樂篇言其才小不堪大用也鴟鵂亦名鵂鶹怪鳥也鳴之則雨晝則無所見夜則目明也此出莊子秋水篇言人見小而不能見大也靜南堂彭州大隨南堂元靜禪師閬州玉山大儒趙約仲之子嗣五祖演禪師頴鋒利也瞎堂曰學道之士要先正其心然後可以正己正物其心既正則萬物定矣未聞心治而身亂者佛祖之教由內及外自近至遠聲色惑於外四肢之疾也妄情發於內心腹之疾也夫見心正而不能治物身正而不能化人蓋一心為根本萬物為枝葉根本壯實枝葉榮茂根本枯悴枝葉夭折善學道者先治內以敵外不貪外以害內故導物要在清心正人固先正己心正己立而萬物不從化者未之有也與顏侍郎書簡堂機和尚住番陽管山僅二十載羮藜飯黍若絶意於榮達嘗下山聞路旁哀泣聲簡堂惻然逮詢之一家寒疾僅亡兩口貧無斂具特就市貸棺葬之鄉人感歎不已侍郎李公椿年謂士大夫曰吾鄉機老有道衲子也加以慈惠及物管山安能久處乎會樞密汪明遠宣撫諸路達於九江郡守林公叔達虗圓通法席迎之簡堂聞命乃曰吾道之行矣即欣然曳杖而來登座説法曰圓通不開生藥鋪單單只賣死貓頭不知那個無思算喫著通身冷汗流緇素驚異法席因茲大振懶菴集番音婆即饒州鄱陽縣也番與鄱同管音管樂器藜藜藿似蒿而可食斂具即棺槨也貸音代賖借也樞密即今都察院官之稱宣撫即巡按也路昔謂之路今名之府死貓頭明向上事也此物本是腥臭之物若有具眼衲僧直下承當一口吞之則佛祖之病悉除通身輕快舉僧問曹山世間何物最貴山云死貓頭為貴丹霞頌云腥臊紅爛不堪聞動處輕輕血汙身何事杳無人著價為伊不是世間珍喻向上事簡堂曰古者修身治心則與人共其道興事立業則與人共其功道成功著則與人共其名所以道無不明功無不成名無不榮今人則不然專己之道惟恐人之勝於己又不能從善務義以自廣也專己之功不欲他人有之又不能任賢與能以自大也是故道不免於蔽功不免於損名不免於辱此古今學者之大分也簡堂曰學道猶如種樹方榮而伐之可以給樵薪將盛而伐之可以作榱桷稍壯而伐之可以充楹枋老大而伐之可以為梁棟得非取功遠而其利大乎所以古之人惟其道固大而不狹其志遠奧而不近其言崇高而不卑雖適時齟齬窮於飢寒殆亡丘壑以其遺風餘烈亘百千年後人猶以為法而傳之鄉使狹道苟容邇志求合卑言事勢其利止榮於一身安有餘澤溥及於後世哉與李侍郎二書榱桷即椽也楹枋上柱下丕木也梁棟脊木曰棟負棟曰梁齟齬上咀下語不相當也又坎坷也溥音普廣也簡堂淳熙五年四月自天台景星巖再赴隱靜給事吳公芾佚老于休休堂和淵明詩十三篇送行其一曰我自歸林下已與世相疏賴有善知識時能過我廬伴我説道話愛我讀佛書既為巖上去我亦為膏車便欲展我鉢隨師同飯蔬脫此塵俗纍長與巖石居此巖固高矣卓出山海圖若比吾師高此巖還不如二我生山窟裏四面是孱顏有巖號景星欲到知幾年今始信奇絶一覽小衆山更得師為主二妙未易言三我家湖山上觸目是林丘若比茲山秀培塿固難儔雲山千里見泉石四時流我今才一到已勝五湖遊四我年七十五木末挂殘陽縱使身未逝亦能豈久長尚冀林間住與師共末光孤雲俄暫出遠近駭蒼黃五愛山端有素拘俗亦可憐昨守當塗郡不識隱靜山羡師來又去愧我復何言尚期無久住歸送我殘年六師心如死灰形亦如稿木胡為衲子歸似響答空谷顧我塵垢身正待醍醐浴更願張佛燈為我代明燭七扶疏巖上樹入夏總成陰幾年荊棘地一旦成叢林我方與衲子共聽海潮音人生多聚散離別忽驚心八我與師來往歲月雖未長相看成二老風流亦異常師宴坐巖上我方為聚糧倘師能早歸此樂猶未央九紛紛學禪者腰包競奔走才能説葛藤癡意便自負求其道德尊如師蓋希有願傳上乘人永光臨濟後十吾邑多緇徒浩浩若雲海大機久已亡賴有小機在仍更與一岑純全兩無悔堂堂二老禪海內共期待十一古無住持事但只傳法旨有能悟色空便可超生死庸僧昧本來豈識西歸履買帖坐禪床佛法將何恃十二僧中有高僧士亦有高士我雖不為高心粗能知止師是個中人特患不為爾何幸我與師俱是鄰家子十三師本窮和尚我亦窮秀才忍窮心已徹老肯不歸來今師雖暫別泉石莫相猜應緣聊復我師豈有心哉景星石刻芾音肺膏潤也以脂膏運車也孱音巉重巖孤峻之貌培塿土阜之山木末日在木之稍不久而沒如人老年不久而亡也蒼黃驚見失措之貌蜀南常雨日出則犬吠南越數州犬皆蒼黃下雪則犬噬狂走至無雪方至空谷師以無心而應物也央盡也負恃也大機杭州天寧寺重機明真禪師台州人嗣玄沙師備禪師小機即簡堂行機禪師一岑即圓極岑禪師庸僧戚戚於衣食念念於名利生不知來死不知去尋常粥飯之流也西歸履達磨御葬熊耳魏武帝使宋雲使西域而回至蔥嶺遇師手携隻履雲乃問何往師曰西天去也雲歸告帝帝令起壙唯空龕隻履在耳買帖將書買院作住持之説也又買求權貴討帖坐禪也恃賴也言既無好僧佛法恃賴何人而興也高僧行解雙應不入世流給事吳公謂簡堂曰古人灰心泯智于千巖萬壑之間澗飲木食若絶意於功名而一旦奉紫泥之詔韜光匿迹於負舂賤役之下初無念於榮達而卒當傳燈之列故得之於無心則其道大其德宏計之於有求則其名卑其志狹惟師度量凝遠繼踵古人乃能棲遲於管山一十七年遂成叢林良器今之衲子內無所守外逐紛華少遠謀無大體故不能扶助宗教所以以不逮師遠矣高侍者記聞紫泥天子六璽皆以武都紫泥以封函匣使鬼神不敢視也武都即今階州其山水皆亦泥為印色至赤也卒終也簡堂曰夫人常情罕能無惑大抵蔽於所信阻於所疑忽於所輕溺於所愛信既偏則聽言不考其實遂有過當之言疑既甚則雖實而不聽其言遂有失實之聽輕其人則遺其可重之事愛其事則存其可棄之人斯皆苟縱私懷不稽道理遂忘佛祖之道失叢林之心故常情之所輕乃聖賢之所重古德云謀遠者先驗其近務大者必謹於微將在博采而審用其中固不在慕高而好異也與吳給事書信疑輕愛遮蔽不明在所信之偏阻隔不通在所疑之甚忽亡其事在所輕之過溺任其人在所愛其事也博採廣覽兼聽之謂高異捨近趣遠曰慕高厭常悅怪曰好異也簡堂清明坦夷慈惠及物衲子稍有詿誤蔽護保惜以成其德嘗言人誰無過在改之為美住鄱陽管山日適值隆冬雨雪連作饘粥不繼師如不聞見故有頌曰地爐無火客囊空雪似楊花落歲窮衲被蒙頭燒榾柮不知身在寂寥中平生以道自適不急于榮名赴廬山圓通請日拄杖草屨而已見者色莊意解九江郡守林公叔達目之曰此佛法中津梁也由是名重四方其去就真得前輩體格歿之日雖走使致力為之涕下清明廉而不淈曰清善知賢否曰明詿怪卦二音過差饘音占厚曰饘薄曰粥榾拙樹無枝葉又短木也自適下音失自樂也侍郎張公孝祥致書謂楓橋演長老曰從上諸祖無住持事開門受徒迫不得已像法衰替乃至有實封投狀買院之説如鄉來楓橋紛紛皆是物也公之出處人具知之啐同時元不著力有緣即住緣盡便行若稗販之輩欲要此地造地獄業不若兩手分付為佳耳寒山寺石刻楓橋蘇州寒山寺前楓橋也紛紛多亂而無取之貌皆商賈之事啐如雞抱卵小雞欲出以嘴吮聲曰啐母雞憶出以嘴嚙之曰作家機緣相投見機而解亦猶是矣稗販上音敗草也似稻而非稻俗謂良田中稗松林中荊棘也販者賤買貴賣也稗或作附也楞嚴經云販如來也雖附我教之中以佛法貪販利養也慈受深和尚謂徑山訥和尚曰二三十年來禪門蕭索殆不堪看諸方長老奔南走北不知其數分煙散衆滿目皆是惟師兄神情不動坐享安逸豈可與碌碌者同日而語也欽歎欽歎此段因緣自非道充德實行解相應豈多得也更冀勉力誘引後昆使曹源涸而復漲覺樹凋而再春實區區下懷之望也筆帖慈受深東京慧林慈受懷深禪師夏氏子嗣長蘆崇信禪師徑山訥臨安府徑山妙空智訥禪師嗣長蘆信禪師殆甚也碌碌庸常多石之貌行解泯解而修曰行心明朗徹曰解涸水乾也區區卑屈也自謙也靈芝照和尚曰讒與謗同邪異邪曰讒必假謗而成蓋有謗而不讒者未見讒而不謗者也夫讒之生也其始因於憎嫉而終成於輕信為之者諂小人也古之人有輸忠以輔君者盡孝以事親者抱義以結友者雖君臣之相得父子之相愛明友之相親一日為人所讒則反目攘臂擯逐離間至於相視如寇讐雖在古聖賢所不能免也然有初不能辨久而後明者有生而不能辨死而後明者有至死不能辨終古不能明者不可勝數矣子遊曰事君數斯辱矣明友數斯疏矣此所以戒人遠讒也嗚呼讒與謗不可不察也且經史載之不為不明學者覽之莫不知其非往往自身陷於讒口噎鬱至死不能自明者是必怒受讒者之不察為讒者之諂也至有羣小至其前復讒於它人則又聽之以為然是可謂聰明乎蓋善為讒者巧便鬬構迎合蒙蔽使其瞢然如為鬼所魅至有終身不能察者孔子曰浸潤之譖膚受之訴言其浸潤之來不使人預覺雖曾參至孝母必疑其殺人市非林藪人必疑其有虎間有不行焉者則謂之明遠君子矣豫以愚拙疏懶不喜諂附妄悅於人遂多為人所讒謗豫聞之竊自省曰彼言果是歟吾當改過彼則我師也彼言果非歟彼亦徒為耳焉能凂我哉於是耳雖聞之而口未嘗辨士君子察不察在彼才識明不明耳吾孰能申其枉直求知於人哉然且不知久而後明邪後世而後明邪終古不明邪文中子曰何以息謗曰無辨吾當事斯語矣芝園集靈芝照杭州靈芝寺元照禪師字湛然餘姚唐氏子嗣未詳讒謗言深切譖害賢良曰讒未至深切但言人惡曰謗反目怒目相視也易云夫妻反目攘臂宣袂出臂也孟子云馮婦攘臂下車寇讐上敵暴也下冤仇也孟子云君之視臣如草芥則臣視君如寇讐子遊下子遊孔子弟子姓言名偃字子遊注云數頻瀆也事君苟諫之不行則去之可也若諫之頻瀆則聽者厭輕者去其爵重則傷其身是求榮於君而反取其辱也導友不納則止之可也若導之頻瀆令聽者厭乃至口然而心不然言和而意不和一言不和怒氣相加是則求親而反疏也噎鬱上氣不通也下氣變色也鬬搆權巧方便令人暗結冤讐如兩將相敵兵仗在後相鬪之形故曰鬪搆也孔子姓孔名丘字仲尼周靈王庚戌二十一年十一月初四日生於魯國兖州鄒邑平鄉晉昌里父叔梁紇母顏氏至唐玄宗諡號曰文宣譖訴子張問明子曰浸潤之譖膚受之訴不行焉可謂明矣注曰浸潤者如水浸灌滋潤漸漬而不驟也譖者毀人之行也言毀人之行漸漬而不驟則聽者不覺其入而信之深矣膚受謂肌膚所受利害切身訴與訴同訴者訴己之冤也言訴冤急迫而切則聽者不及致詳而發之暴矣二者難察能察之則可見其心之明照之遠不蔽於近也曾參姓曾名參字子輿孔子弟子武城人至孝孔子因之作孝經秦之甘茂曰魯人與曾參同名者殺人人告其母母曰吾子不殺人織機自若少頃人又告曾參殺人母又自若又一人告之其母投杼下機踰墻而走臣賢不及曾參王信臣又不及其母疑臣者不特三人臣恐大王投杼矣秦武王任使甘茂伐韓韓侵宜陽之言市有虎韓子曰龐共太子質於邯鄲謂魏王曰今有一人言市中有虎大王曰否又一人言信乎王曰否三人言有虎王信乎王曰寡人信之矣龐共曰市無虎明矣三人言城市有虎王既信矣而説之言慎勿輕信願王察之王大悅凂音每染汙也申呈也明也文中子姓王名通字仲淹洛陽龍門人沒後門人諡為文中子隋煬帝時人西遊長安見帝於太極殿奏太平十二䇿遵王道推霸略稽古驗今帝大悅曰得生幾晚下其議於公卿不允文中子知謀之不用作東征歌而歸讀詩書正禮樂修六經贊易道九年六經大備門人自遠而至者河南董常太山姚義京兆杜如晦趙郡李靖南陽陳元河東薛守中山賈瓊太原王圭清河房玄齡巨鹿魏徵頴川陳叔達咸稱為師面南而受王佐之道及餘往來受道千餘人賈瓊問曰何以息謗文中子曰無辨問如何止怨曰無爭乃云聞謗而怒者讒之囮見譽而喜者之媒絶囮去媒讒遠矣囮音由鳥之媒也事承也習也懶菴樞和尚曰學道人當以悟為期求真善知識決擇之絲頭情見不盡即是生死根本情見盡處須究其盡之所以如人常在家愁什麼家中事不辦溈山云今時人雖從緣得一念頓悟自理猶有無始習氣未能頓盡須教渠淨除現業流識即是修也不是別有行門令渠趣向溈山古佛故能發此語如或不然眼光落地時未免手腳忙亂依舊如落湯螃蟹也懶菴樞臨安府靈隱寺懶菴道樞禪師嗣道場居惠禪師渠他也懶菴曰律中云僧物有四種一者常住常住二者十方常住三者現前常住四者十方現前常住且常住之物不可絲毫有犯其罪非輕先聖後聖非不丁寧往往聞者未必能信信者未必能行山僧或出或處未嘗不以此切切介意猶恐有所未至因述偈以自警云十方僧物重如山萬劫千生豈易還金口共談曾未信他年爭免鐵城關人身難得好思量頭角生時歲月長堪笑貪他一粒米等間失却半年糧四種常住鈔云僧物有四種一者常住常住謂衆僧舍宅什物樹木田園僕畜米麥等物以體局當處不通餘界但得受用不許分賣故重云常住常住二者十方常住謂寺中供僧成熟之飲食等物體具十方非局本處善現律云不打鐘食犯偷盜罪今諸寺居同食食既成熟乃打鐘鼓蓋明十方僧俱有分故也三者現前常住者此有二種謂一物現前二僧衆現前但此物惟施此處現前僧衆故也四者十方現前常住謂亡僧之物施輕體同十方唯本處現在僧得分故毗婆沙論云盜亡僧物則於誰處得根本罪答已作羯磨者於羯磨衆處得若未作羯磨者普於一切善諸説法衆得今詳分亡僧物十方來僧在羯磨數前即得羯磨後來不得也懶菴曰涅槃經云若人聞説大涅槃一句一字不作字相不作句相不作聞相不作佛相不作説相如是義者名無相相達磨大師航海而來不立文字者蓋明無相之旨非達磨自出新意別立門戶近世學者不悟斯旨意謂禪宗別是一種法門以禪為宗者非其教以教為宗者非其禪遂成兩家之説互相詆呰譊譊不能自已噫所聞淺陋一至於此非愚即狂甚可歎息也心地法門涅槃梵語涅槃此云滅度謂除煩惱度過生死故也又涅而不生槃而不滅不生不滅故名涅槃不作下字相文字空也句相語言性空也聞相能聞性空也佛相能説法人空也説相所説之法空也航渡人之舟也譊音嬈喧爭也噫恨嘆之辭按此書有三百篇所載者皆諸老嘉言善行使後學者依而行之泯利欲之心去人我之見而造乎道德之域矣猶恐溺迹名言故取涅槃置於卷終欲使拂拭名言而明無相之旨也音切穫胡郭切惴之睡切睽苦圭切獪古邁切澧力邸切瞪丑庚切鏌靡各切鎁以遮切磊力罪切以之切攫居縛切趦七私切趄七余切囓五狡魚結二切詖彼寄切管古短切榱所龜切桷古學切齟才與切齬牛莒切塿力狗切饘之延切榾古忽切拙當骨切譖莊禁切訴蘇故切譊女交切
