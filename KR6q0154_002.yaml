body:
  text: 虎林澄遠居士張文憲程叔甫參閲湛堂準和尚初參真淨常炙燈帳中看讀真淨呵曰所謂學者求治心也學雖多而心不治縱學而奚益而況百家異學如山之高海之深子若為盡之今棄本逐末如賤使貴恐妨道業直須杜絶諸緣當求妙悟他日觀之如推門入臼故不難矣湛堂即時屏去所習專注禪觀一日聞衲子讀諸葛孔明出師表豁然開悟凝滯頓釋辨才無礙在流輩中鮮有過者杜斷也塞也注灌注也如瓶注水使心不亂也出師表諸葛武侯受顧命輔後主七擒孟獲已定南方乃出師伐魏臨行遺表於後主湛堂曰有道德者樂於衆無道德者樂於身樂於衆者長樂於身者亡今稱住持者多以好惡臨衆故衆人拂之求其好而知其惡惡而知其好者鮮矣故曰與衆同憂樂同好惡者義也義之所在天下孰不歸焉二事癩可贅疣集好惡好人之所惡惡人之所好是為拂人之性災必逮夫身拂逆也湛堂曰道者古今正權善弘道者要在變通不知變者拘文執教滯相殢情此皆不達權變故僧問趙州萬法歸一一歸何處州云我在青州做領布衫重七斤謂古人不達權變能若是之酬酢聖人云幽谷無私遂致斯響洪鐘受扣無不應是知通方上士將返常合道不守一而不應變也與李商老書殢係替二音極困也滯也僧問僧問處名偏辟問州答處名信手拈來無意路話又謂放風前箭轉格外機須向言前領旨句外明宗不可尋言逐句妄生揆度趙州已至不立玄危平坦之地了無佛法身心凡酬酢信口開合皆無情識不可較量也故雪竇頌曰偏辟曾挨老古錐七斤衫重少人知而今擲向西湖裏下載清風付與誰趙州趙州觀音院從諗禪師曹州郝氏子嗣南泉普願禪師聲傳大夏名聞九州壽一百二十歲酬酢下音昨客報主曰酢主答客曰酬音巨謂飛天上神獸鹿頭龍身說文云鐘鼓之柎也飾為猛獸釋名曰橫曰栒縱曰湛堂曰學者求友須是可為師者時中長懷尊敬作事取法期有所益或智識差勝於我亦可相從警所未逮萬一與我相似則不如無也寶峯實録差楚宜切略也湛堂曰祖庭秋晚林下人不為囂浮者固自難得昔真如住智海嘗言在湘西道吾時衆雖不多猶有老衲數輩履踐此道自大溈來此不下九百僧無七五人會我說話豫以是知得人不在衆多也實録秋晚末運之際法道凋零湛堂曰惟人履行不可以一酬一詰固能盡知蓋口舌辨利者事或未可信辭語拙訥者理或不可窮雖窮其辭恐未窮其理能服其口恐未服其心惟人難知聖人所病況近世衲子聰明不務通物情視聽多只伺過隙與衆違欲與道乖方相尚以欺相以詐使佛祖之道靡靡而愈薄殆不可救矣答魯直書訥言遲也尚加也蒙昧也殆乃也危也湛堂謂妙喜曰像季比丘外多狥物內不明心縱有弘為皆非究竟蓋所附卑猥而使然如搏牛之虻飛止數步若附驥尾便有追風逐日之能乃依托之勝也是故學者居必擇處遊必就士遂能絶邪僻近中正聞正言也昔福嚴雅和尚每愛真如哲標致可尚但未知所附者何人一日見與大寧寬蔣山元翠巖真偕行雅喜不自勝從容謂哲曰諸大士法門龍象子得從之遊異日支吾道之傾頺彰祖教之利濟固不在豫之多囑也日涉記驥尾參逐人行曰附驥尾謂蒼蠅之飛不可數步托於驥尾乃能千里之達也福嚴雅澤州福嚴良雅禪師嗣洞山守初青原下八世也大寧寬洪州大寧道寬禪師嗣石霜楚禪師南嶽下十一世也蔣山元蔣山贊元禪師婺州義烏人傅大士之裔嗣石霜禪師偕同也並也龍象水中力大龍也陸中有威象也巨德以喻之者言其有力而托有威而可習故也支撑持也湛堂謂妙喜曰參禪須要識慮高遠志氣超邁出言行事持信於人勿隨勢利苟枉自然不為朋輩描摸時所上下也寶峯記聞上下時人以名利為上師今不愛名利故不為時上時人以庸鄙為下師今操道德故不為時下也湛堂曰豫昔同靈源侍晦堂於章江寺靈源一日與二僧入城至晚方歸晦堂因問今日何往靈源曰適往大寧來時死心在旁厲聲呵曰參禪欲脫生死發言先要誠實清兄何得妄語靈源面熱不敢對自爾不入城郭不妄發言豫固知靈源死心皆良器也日涉記死心隆興府黃龍死心悟新禪師韶州黃氏子嗣黃龍祖心禪師南嶽下十三世也良器良大也靈源知過必改死心正而不屈湛堂曰靈源好閲經史食息未嘗少憩僅能背諷乃止晦堂因呵之靈源曰嘗聞用力多者收功遠故黃太史魯直曰清兄好學如饑渴之嗜飲食視利養紛華若惡臭蓋其誠心自然非特爾也贅疣集憩息也黃太史諱庭堅字魯直號山谷居士得法於黃龍祖心禪師特爾天性如此非故強為靈源清和尚住舒州太平每見佛眼臨衆周密不甚失事因問其要佛眼曰用事寧失於寬勿失於急寧失於略勿失於詳急則不可救詳則無所容當持之於中道待之以含緩庶幾為臨衆行事之法也拾遺靈源謂長靈卓和尚曰道之行固自有時昔慈明放意於荊楚間含耻忍垢見者忽之慈明笑而已有問其故對曰連城與瓦礫相觸豫固知不勝矣逮見神鼎後譽播叢林終起臨濟之道嗟乎道與時也苟可強乎筆帖長靈卓東京天寧長靈守卓禪師泉州莊氏子嗣靈源清禪師南嶽十四世連城趙有卞和璧秦昭王欲以十二連城貿之趙遣相如送之入秦相如視秦王惟有愛璧之心而無割城之意乃詐曰璧有瑕請示之玉授璧與相如如將璧却倚柱立怒髮衝冠謂曰臣聞布衣之交尚不忍相欺況大國乎王若急臣臣頭璧俱碎於柱王恐璧碎使人扶相如起礫小石也神鼎潭州神鼎洪諲禪師襄水扈氏子嗣首山念禪師南嶽下九世尋常一衲以度寒暑後隱衡嶽有一貴豪來山遊見師氣貌間靜一鉢無餘遂拜請住神鼎十年枯淡室無升米一鉢挂壁日收盞飯一枯木床為法座殘僧數輩圍之始終如此後宗風大振門弟子氣吞諸方由是慈明髮長不剪敝衣而特往見鼎鼎曰汾陽有西河師子是否慈明指後厲聲曰屋倒矣鼎回顧相視慈明坐脫隻履而視之鼎老忘問又失公所在慈明遂整衣且行且日見面不如聞名遂去鼎遣人追之不返鼎嘆曰汾陽有此兒也慈明自此名重四方靈源謂黃太史曰古人云抱火措於積薪之下而𥨊其上火未及然固以為安此誠喻安危之機死生之理明如杲日間不容髮夫人平居燕處罕以生死禍患為慮一旦事出不測方頓足扼腕而救之終莫能濟矣筆帖古人云漢文帝六年淮南厲王長謀反廢處蜀郡嗔恚不食死梁太傅賈誼上疏曰臣竊惟事勢可為痛哭者一可為流涕者二可為長太息者六若其他背理而傷道者難遍以疏舉進言者皆言天下已安已治矣臣獨以為未也曰安且治者非愚則諛皆非事實知治亂之體者也夫抱火厝之積薪之下而𥨊其上火未及燃固為之安方今之勢何以異此本未外逆首尾衡決國制搶攘非甚有紀陛下可不一令臣得熟數之於前因陳治安之䇿試詳擇焉扼腕上持也下手腕也謂趺腳捶胸以手持腕救之晚矣靈源謂佛鑑曰凡接東山師兄書未嘗言世諦事唯丁寧忘軀弘道誘掖後來而已近得書云諸莊旱損我總不憂只憂禪家無眼今夏百餘人室中舉個狗子無佛性話無一人會得此可為憂至哉斯言與憂院門不辦怕官人嫌責慮聲位不揚恐徒屬不盛者實霄壤矣每念此稱實之言豈復得聞吾侄為嫡嗣能力振家風當慰宗屬之望是所切禱蟾侍者日録靈源曰磨礲砥礪不見其損有時而盡種樹蓄養不見其益有時而大積德纍行不知其善有時而用棄義背理不知其惡有時而亡學者果熟計而履踐之成大器播美名斯今古不易之道也筆帖磨礲全篇出漢書枚乘傳乃諫吳王之言也靈源謂古和尚曰禍福相倚吉凶同域惟人自召安可不思或專己之喜怒而隘於含容或私心靡費而從人之所欲皆非住持之急茲實恣肆之攸漸禍害之基源也筆帖古和尚惠古禪師嗣靈源清禪師南嶽下十四世相倚背向之義謂背之則禍生向之則福長也同域美惡之義德美則吉性暴則凶謂心者衆妙之門羣靈之府升降之源禍福之本也靡費奢侈也攸漸始終之義靈源謂伊川先生曰禍能生福福能生禍禍生於福者緣處災危之際切於思安深於求理遂能祗畏敬謹故福之生也宜矣福生於禍者緣居安泰之時縱其奢欲肆其驕怠尤多輕忽侮慢故禍之生也宜矣聖人云多難成其志無難喪其身得乃喪之端喪乃得之理是知福不可屢僥幸得不可常覬覦居福以慮禍則其福可保見得而慮喪則其得必臻故君子安不忘危理不忘亂者也筆帖伊川姓程名字正叔號伊川河南人問道於靈源禪師祗謹也恭也侮輕慢也屢頻也數也僥幸上不當求而求之下不當得而得之覬覦上音冀下音俞希望欲得也靈源謂伊川先生曰夫人有惡其跡而畏其影却背而走者然走愈急迹愈多而影愈疾不如就陰而止影自滅而迹自絶矣日用明此可坐進斯道筆帖惡跡畏影此篇言捨妄歸真不起生滅心也所行之事喻跡起生滅心喻影背走喻捨妄歸真就陰喻顯妄明真所謂揚湯止沸不如釜底抽薪靈源曰凡住持位過其任者鮮克有終蓋福德淺薄量度狹隘聞見鄙陋又不能從善務義以自廣而致然也日録過任德薄而位尊任重而福淺自廣自廣其德量聞見也靈源聞覺範貶竄嶺海歎曰蘭植中塗必無經時之翠桂生幽壑終抱彌年之丹古今才智喪身讒謗罹禍者多求其與世浮沉能保其身者少故聖人言當世聰明深察而近於死者好議人者也博辨宏大而危其身者好發人之惡也在覺範有之矣章江集覺範瑞州清源寺慧洪覺範禪師本郡彭氏子嗣真淨文禪師南嶽下十三世博覽群書有大辨才作林間録僧寶傳也彌遠也浮沉上現也下隱也聖人言史記孔子適周見老子老子曰吾聞富貴者送人以財仁者送人以言吾雖不能富貴而竊仁者之號今送子以言也當今之士聰明深察而近於死者好譏議人者也博辨宏遠而危其身者好發人之惡也為人臣子可不慎乎靈源謂覺範曰聞在南中時究楞嚴特加箋釋非不肖所望蓋文字之學不能洞當人之性源徒與後學障先佛之智眼病在依他作解塞自悟門資口舌則可勝淺聞廓神機終難極妙證故於行解多致參差而日用見聞尤增隱昧也章江集箋傳之未盡曰箋參差不齊之貌乃言行相違也靈源曰學者舉措不可不審言行不可不稽寡言者未必愚利口者未必智鄙朴者未必悖承順者未必忠故善知識不以辭盡人情不以意選學者夫湖海衲子誰不欲求道於中悟明見理者千百無一其間修身勵行聚學樹德非三十年而不能致偶一事過差而叢林棄之則終身不可立夫耀乘之珠不能無纇連城之璧寧免無瑕凡在有情安得無咎夫子聖人也猶以五十學易無大過為言契經則曰不怕念起惟恐覺遲況自聖賢已降孰無過失哉在善知識曲成則品物不遺矣故曰巧梓順輪桷之用枉直無廢材良御適險易之宜駑驥無失性物既如此人亦宜然若進退隨愛憎之情離合繫異同之趣是由捨繩墨而裁曲直棄權衡而較重輕雖曰精微不能無謬矣言行言乃行之實行乃言之表鄙朴誠實也辭盡下唐德宗貞元十年兵部侍郎陸贄諫曰明王不可以辭盡人情不可以意選進士進退隨憎愛之情離合繫異同之趣是由捨繩墨而意裁曲直棄權衡而手揣重輕雖日精微不能無謬耀乘珠魏惠王曰寡人有徑寸之珠照車前後各十二乘者數枚齊王曰吾有四臣照千里之外豈特十二乘也魏王有愧色學易聖人雖生知未嘗自言無大過雖是謙辭而道理實無窮盡也學易則明乎吉凶消長之理進退存亡之道故聖人冀永年之窮經庶所行之無咎契經梵語修多羅此云契經謂契理契機乃契理合機之教品物言高低大小利鈍之人不可遺棄也巧梓輪桷之用梓木匠也輪車輪也桷榱桷也蓋巧梓用木之際隨其木性而用之枉者可以為輪直者可以為桷使不廢其材也昔齊桓公讀書於堂上輪扁斫輪於堂下釋鑿而問曰敢問君之所讀者何書公曰聖人之言也扁曰聖人在乎公曰聖人死矣扁曰然君所讀者槽粕耳公怒曰寡人讀書輪人安得譏乎有說則可無說則死扁曰以臣事觀之臣當斫輪徐則甘而不固疾則苦而不入不徐不疾得之於心應之於手口不能言有數存焉臣不能諭臣之子子不能受之於臣臣年七十而老斫輪古之斫輪者與其不可傳而死者多矣故君之所讀者槽粕耳桓公大喜出莊子良御使馬之人也善使馬者稱而作之駑驥上即鈍馬也下即良馬失性各得遲疾之宜使不失其所賦性也繩墨梓人所用者也木若得之則曲直分明而見矣靈源曰善住持者以衆人心為心未嘗私其心以衆人耳目為耳目未嘗私其耳目遂能通衆人之志盡衆人之情夫用衆人之心為心則我之好惡乃衆人好惡故好者不邪惡者不謬又安用私托腹心而甘服其諂媚哉既用衆人耳目為耳目則衆人聰明皆我聰明故明無不鑒聰無不聞又安用私託耳目而固招其蔽惑邪夫布腹心託耳目惟賢達之士務求己過與衆同欲無所偏私故衆人莫不歸心所以道德仁義流布遐遠者宜其然也而愚不肖之意務求人之過與衆違欲溺於偏私故衆人莫不離心所以惡名險行傳播遐遠者亦宜其然也是知住持人與衆同欲謂之賢哲與衆違欲謂之庸流大率布腹心託耳目之意有殊而善惡成敗相返如此得非求過之情有異任人之道不同者哉庸流心不存慎終之規口不吐訓格之言不擇人以托身不立行以自定見小措大而不知所務從物而流不知所執故曰庸流靈源曰近世作長老涉二種緣多見智識不明為二風所觸喪於法體一應逆緣多觸衰風二應順緣多觸利風既為二風所觸則喜怒之氣交於心鬱勃之色浮於面是致取辱法門譏誚賢達惟智者善能轉為攝化之方美導後來如琅琊和尚往蘇州看范希文因受信施及千餘緡遂遣人陰計在城諸寺僧數皆密送錢同日為衆檀設齊其即預辭范公是日侵蚤發船逮天明衆知已去有追至常州而得見者受法利而回觀此老一舉使姑蘇道俗悉起信心增深道種此所謂轉為攝化之方與夫竊法位苟利養為一身之謀者實霄壤也與德和尚書勃色變也誚才笑切以言相責也琅琊徐州琅琊廣照慧覺禪師洛陽人嗣汾陽昭禪師南嶽下十世范希文姓范名仲淹字希文汝南人宋仁宗慶曆中拜為參知政事諡文正緡音民錢串也文正公謂琅琊曰去年到此思得林下人可語者嘗問一吏諸山有好僧否吏稱北寺瑞光希茂二僧為佳豫曰此外諸禪律中別無耶吏對豫曰儒尊士行僧論德業如希茂二人者三十年蹈不越閫衣惟布素聲名利養了無所滯故邦人高其操履而師敬之若其登座說法代佛揚化機辨自在稱善知識者非頑吏能曉逮暇日訪希茂二上人視其素行一如吏言豫退思舊稱蘇秀好風俗今觀老吏尚能分君子小人優劣況其識者邪琅琊曰若吏所言誠為高議請記之以曉未聞琅琊別録瑞光寺有四瑞謂鐘鼓自鳴寶塔放光瑞竹交加白龜聽法故稱曰瑞光即今之臥佛寺也蹈行也閫門限也上人內有智德外有勝行在人之上故稱上人秀即嘉興府靈源曰鍾山元和尚平生不交公卿不苟名利以卑自牧以道自樂士大夫初勉其應世元曰苟有良田何優晚成第恐乏才具耳荊公聞之曰色斯舉矣翔而後集在元公得之矣贅疣集以卑自牧象曰謙謙君子卑以自牧也卑者謙之至也謂君子以自謙自卑之道自牧自處也色斯舉矣鳥之為物也見人顏色不善則飄然而逝回翔審視至彈射不驚之處而後下之世人見機而作亦當如此靈源曰先哲言學道悟之為難既悟守之為難既守行之為難今當行時其難又過於悟守蓋悟守者精進堅卓勉在己躬而已惟行者必等心死誓以損己益他為任若心不等誓不堅則損益倒置便墮為流俗阿師是宜祗畏靈源曰東山師兄天資特異語默中度尋常出示語句其理自勝諸方欲效之不詭俗則淫陋終莫能及求於古人中亦不可得然猶謙光導物不啻饑渴嘗曰我無法寧克勤諸子真法門中罪人矣淫流蕩之過也謙光位愈高而心愈下則尊而且光靈源道學行義純誠厚德有古人之風安重寡言尤為士大夫尊敬嘗曰衆人之所忽聖人之所謹況為叢林主助宣佛化非行解相應詎可為之要在時時檢責勿使聲名利養有萌於心儻法令有所未孚衲子有所未服當退思修德以待方來未見有身正而叢林不治者所謂觀德人之容使人之意消誠實在茲記聞純誠精一無雜曰純真實無妄曰誠儻或然之辭孚信也靈源謂圓悟曰衲子雖有見道之資若不深蓄厚養發用必峻暴非特無補教門將恐有招禍辱圓悟禪師曰學道存乎信立信在乎誠存誠於中然後俾衆無惑存信於己可以教人無欺惟信與誠有補無失是知誠不一則心莫能保信不一則言莫能行古人云衣食可去誠信不可失惟善知識當教人以誠信且心既不誠事既不信稱善知識可乎易曰惟天下至誠遂能盡其性能盡其性則能盡人之性而自既不能盡於己欲望盡於人衆必紿而不從自既不誠於前而曰誠於後衆必疑而不信所謂割髮宜及膚剪爪宜侵體良以誠不至則物不感損不至則益不臻蓋誠與信不可斯須去己也明矣與虞察院書圓悟成都府昭覺寺佛果克勤禪師彭州駱氏子嗣五祖演禪師保全守曰保誠信心實曰誠乃信之體也言實曰信方誠之用也惟天下至誠能盡其性則能盡人之性能盡人之性則能盡物之性能盡物之性則可以贊天地之化育可以贊天地之化育則可以與天地參矣注曰性者德無不實理無不具故無人欲之私能盡者知之無不明處之無不當天地至誠者言聖人之德天下莫能加也贊猶助也參者與天地並立而為三紿欺慢也斯須暫時也圓悟曰人誰無過過而能改善莫大焉從上皆稱改過為賢不以無過為美故人之行事多有過差上智下愚俱所不免唯智者能改過遷善而愚者多蔽過飾非遷善則其德日新是稱君子飾過則其惡彌著斯謂小人是以聞義能徙常情所難見善樂從賢德所尚望公相忘於言外可也與文主簿過惡無心失理曰過有心害理曰惡飾非人有過非恐人知之以巧言自欲免過而譽其善義能徙徙者移也孔子曰德之不修學之不講聞義不能徙不善不能改是吾憂也尹氏曰德必修而後成學必講而後明見義能徙改過無吝此四者日新之要苟未能之聖人猶憂之況學者乎圓悟曰先師言做長老有道德感人者有勢力服人者猶如鸞鳳之飛百禽愛之虎狼之行百獸畏之其感服則一其品類固霄壤矣贅疣集圓悟謂隆藏主曰欲理叢林而不務得人之情則叢林不可理務得人之情而不勤於接下則人情不可得務勤接下而不辨賢不肖則下不可接務辨賢不肖而惡言其過悅順其己則賢不肖不可辨惟賢達之士不惡言過不悅順己惟道是從所以得人情而叢林理矣廣録隆藏主平江府虎丘紹隆禪師和之含山人嗣圓悟勤禪師南嶽下十五世圓悟曰住持以衆智為智衆心為心恆恐一物不盡其情一事不得其理孜孜訪納惟善是求當問理之是非詎論事之大小若理之是雖靡費大而作之何傷若事之非雖用度小而除之何害蓋小者大之漸微者著之萌故賢者慎初聖人存戒涓涓不遏終變桑田炎炎靡除卒燎原野流煽既盛禍災已成雖欲救之固無及矣古云不矜細行終纍大德此之謂也與佛智書智分別是非曰智又知也妙衆理而宰萬物也孜孜切切也汲汲也遏止也炎小火之貌原廣平曰原煽大火也不矜細行書云烏乎夙夜罔或不謹不矜細行終纍大德為山九仞功虧一簣注曰或猶言萬一也呂氏曰此是勤德工夫或之一字最有意味一暫止息則非勤德也矜者持也細行者小事也纍去聲事相緣及圓悟謂元布袋曰凡稱長老之職助宣佛化常思以利濟為心行之而無矜則所及者廣所濟者衆然一有矜己逞能之心則僥幸之念起而不肖之心生矣雙林石刻下出雲門菴集元布袋台州護國寺此菴景元禪師永嘉南溪張氏子嗣圓悟禪師南嶽下十五世圓悟謂妙喜曰大凡舉措當謹終始故善作者必善成善始者必善終謹終如始則無敗事古云惜乎衣未成而轉為裳行百里之半於九十斯皆歎有始而無終也故曰靡不有初鮮克有終昔晦堂老叔曰黃檗勝和尚亦奇衲子但晚年謬耳觀其始得不謂之賢雲門菴集黃檗勝瑞州黃檗山惟勝禪師潼州羅氏子嗣黃龍南禪師南嶽下十二世得豈也圓悟謂佛鑒曰白雲師翁動用舉措必稽往古嘗曰事不稽古謂之不法豫多識前言往行遂成其志然非特好古蓋今人不足法先師每言師翁執古不知時變師翁曰變故易常乃今人之大患豫終不為也蟾和尚日録佛鑒舒州太平寺佛鑑慧勤禪師本郡江氏子嗣五祖演禪師南嶽下十四世前言往行易大畜卦象曰天在山中大畜君子多識前言往行以畜其德注曰前言往行是古聖之言行也觀其言察其行以成德乃大畜之義畜積成也故常古人不更之常道也佛鑒勤和尚自太平遷智海郡守曾公元禮問孰可繼住持佛鑒舉昺首座公欲得一見佛鑒曰昺為人剛正於世邈然無所嗜好請之猶恐弗從詎肯自來耶公固邀之昺曰此所謂呈身長老也竟逃於司空山公顧謂佛鑒曰知子莫若父即命諸山堅請抑不得已而應命蟾侍者日録昺首座韶州南華智昺禪師蜀川永康人為人嚴厲時號昺鐵面嗣佛鑒勤禪師南嶽下十五世呈身先見其身後任住持也長老耆德之稱了達法性內有智德使學者尊從故曰長老也抑發語之辭佛鑒謂詢佛燈曰高上之士不以名位為榮達理之人不為抑挫所困其有承恩而效力見利而輸誠皆中人以下之所為日録詢佛燈浙江湖州府安吉州何山佛燈守詢禪師本郡史氏子嗣佛鑒勤禪師南嶽下十五世也挫摧折也效獻也盡也輸誠盡敬之貌佛鑒謂昺首座曰凡稱長老要須一物無所好一有所好則被外物賊矣好嗜欲則貪愛之心生好利養則奔競之念起好順從則阿諛古人合好勝負則人我之山高好掊克則嗟怨之聲作總而窮之不離一心心若不生萬法自泯平生所得莫越於斯汝宜勉旃規正來學南華石刻賊侵害愛心之纏綿不已曰愛阿諛上卑屈也下諂詐也掊克聚斂也謂刻剝民財也旃之也佛鑒曰先師節儉一鉢囊鞋袋百綴千補猶不忍棄置嘗曰此二物相從出關僅五十年矣詎肯中道棄之有泉南悟上座送褐布裰自言得之海外冬服則溫夏服則凉先師曰老僧寒有柴炭紙衾熱有松風蓄此奚為終却之日録綴補衲也褐褐毛布裰氷火二鼠之毛所織之布也火鼠入火不焚毛長尺許所謂火浣布是也氷鼠者北方有氷厚百尺有鼠在下但食氷毛長數寸可以為布二事合成冬暖夏凉出神異記佛鑒曰先師聞真淨遷化設位辦供哀哭過禮歎曰斯人難得見道根柢不帶枝葉惜其早亡殊未聞有繼其道者江西叢林自此寂寥耳日録佛鑑曰先師言白雲師翁平生疏通無城府顧義有可為者踊躍以身先之好引拔賢能不喜附離苟合一榻翛然危坐終日嘗謂凝侍者曰守道安貧衲子素分以窮達得喪移其所守者未可語道也日録疏通能知遠古書籍也又胸次岸谷海納山容無彼此之念也城府遮蔽之義謂外無城郭內無府庫無外內之隄防也踊躍見義合理踴躍而前進也附離苟合勝利則依附害則離去苟合者不遵理義而苟且迎合也翛音肖鳥之孤飛也又自如也佛鑒曰為道不憂則操心不遠處身常逸則用志不大古人歷艱難嘗險阻然後享終身之安蓋事難則志鋭刻苦則慮深遂能轉禍為福轉物為道多見學者逐物而忘道背明而投暗於是飾己之不能而欺人以為智彊人之不逮而侮人以為高以此欺人而不知有不可欺之先覺以此掩人而不知有不可掩之公論故自智者人愚之自下者人高之惟賢者不然謂事散而無窮能涯而有盡欲以有盡之智而周無窮之事則識有所偏神有所困故於大道必有所闕焉與秀紫芝書鋭鋒利深入之貌慮深不入虎穴焉得虎子學者不可以世事關其心逍遙乎微妙之境優游乎何有之鄉然後必蹈於無事安樂之境所偏其識不逮則事理不能圓融也闕閉而不通也佛鑒謂龍牙才和尚曰欲革前人之弊不可亟去須因事而革之使小人不疑則庶無怨恨豫嘗言住持有三訣見事能行果斷三者缺一則見事不明終為小人忽慢住持不振矣龍牙才潭州龍牙寺智才禪師舒州施氏子嗣佛鑒勤禪師南嶽下十五世佛鑒曰凡為一寺之主所貴操履清淨持大信以待四方衲子差有毫髮猥媟之事於己不去遂被小人窺雖有道德如古人則學者疑而不信矣山堂小參猥媟上鄙也下苟且也窺小視貌佛鑒曰佛眼弟子唯高菴徑挺不近人情為人無嗜好作事無黨援清嚴恭謹始終以名節自立有古人之風近世衲子罕有倫比與耿龍學書佛眼舒州龍門佛眼清遠禪師臨卭李氏子嗣五祖演禪師南嶽下十四世也徑挺至公而無私也黨援上朋比也下引拔也佛眼遠和尚曰蒞衆之容必肅於閒暇之日對賓之語當嚴於私昵之時林下人發言用事舉措施為先須籌慮然後行之勿倉卒暴用或自不能豫決應須咨詢耆舊博問先賢以廣見聞補其未能燭其未曉豈可虗作氣勢專逞貢高自彰其醜苟一行失之於前則百善不可得而掩於後矣與真牧書蒞衆上臨也謂立身之道內剛而外柔蒞衆之容上承而下順不和則不可接物不嚴則不可馭下也昵親近也佛眼曰人生天地間稟陰陽之氣而成形自非應真乘悲願力出現世間其利欲之心似不可卒去惟聖人知不可去人之利欲故先以道德正其心然後以仁義禮智教化隄防之日就月將使其利欲不勝其仁義禮智而全其道德矣與耿龍學書佛眼曰學者不可泥於文字語言蓋文字語言依他作解障自悟門不能出言象之表昔達觀頴初見石門聰和尚室中馳騁口舌之辨聰曰子之所說乃紙上語若其心之精微則未覩其奧當求妙悟悟則超卓傑立不乘言不滯旬如師子王吼哮百獸震駭回觀文字之學何啻以什較百以千較萬也龍間記聞泥去聲滯也達觀頴潤州金山曇頴禪師嗣石門聰禪師佛眼謂高菴曰百丈清規大槩標正檢邪軌物齊衆乃因時以制後人之情夫人之情猶水也規矩禮法為隄防隄防不固必致奔突人之情不制則肆亂故去情息妄禁惡止邪不可一時亡規矩然則規矩禮法豈能盡防人之情茲亦助入道之階墀也規矩之立昭然如日月望之者不迷擴乎如大道行之者不惑先聖建立雖殊歸源無異近代叢林有力役規矩者有死守規矩者有蔑視規矩者斯皆背道失禮縱情逐惡而致然曾不念先聖救末法之弊禁放逸之情塞嗜欲之端絶邪僻之路故所以建立也東湖集階墀上階級也下丹墀也謂淺而深也蔑輕也佛眼謂高菴曰見秋毫之末者不自見其睫舉千鈞之重者不自舉其身猶學者明於責人昧於恕己者不少異也真牧集高菴南康軍雲居高菴善悟禪師泮州李氏子嗣佛眼遠禪師南嶽下十五世秋毫莊子曰秋獸生毛至微孟子曰明足以察秋毫之末而不見輿薪睫音接眉毛也鈞三十斤也高菴悟和尚曰豫初遊祖山見佛鑒小參謂貪欲瞋恚過如冤賊當以智敵之智猶水也不用則滯滯則不流不流則智不行矣其如貪欲瞋恚何豫是時雖年少心知其為善知識也遂求挂搭雲居實録高菴曰學者所存中正雖百折挫而浩然無憂其或所向偏邪朝夕區區為利是計豫恐堂堂之軀將無措於天地之間矣真牧集區區卑小之稱猶碌碌也高菴曰道德仁義不獨古人有之今人亦有之以其智識不明學問不廣根器不淨志氣狹劣行之不力遂被聲色所移使不自覺蓋因妄想情念積習濃厚不能頓除所以不到古人地位耳與耿龍學書下出真牧集高菴聞成枯木住金山受用侈靡歎息久之曰比丘之法所貴清儉豈宜如此徒與後生輩習輕肥者增無厭之求得不愧古人乎成枯木東京淨國枯木法成禪師何朔人嗣芙蓉楷禪師清原下十二世也侈靡奢費也輕肥乘肥馬衣輕裘也古詩云肥馬衣輕裘佯佯過閭里雖得市廛憐還為識者鄙高菴曰住持大體以叢林為家區別得宜付授當器舉措係安危之理得失關教化之源為人範模安可容易未見住持弛縱而能使衲子服從法度凌遲而欲禁叢林暴慢昔育王諶遣首座仰山偉貶侍僧載於典文足為令範今則各狥私欲大隳百丈規繩懈於夙興多缺參會禮法或縱貪叨而無忌憚或緣利養而致喧爭至於便僻醜惡靡所不有烏乎望法門之興宗教之盛詎可得邪龍昌集區分也係連及也關在也干也弛廢也弓解凌遲凋敗也育王諶慶元府育王寺無示介諶禪師溫州張氏子嗣長靈卓禪師其性剛毅臨衆合古法當時有諶鐵面之稱仰山偉袁州仰山行偉禪師何朔人嗣黃龍南禪師其為人性剛蒞事有法度使某人幹某事莫敢違者嘗將十二輩名付維那使明日俱到方丈受面折及會茶時即失一人偉問為誰侍曰隨州永泰首座曰泰遊山未回以請他僧備具偉然之俄有告曰泰實在首座匿之偉色莊使搜得泰自陳拙弱恐失所受之事首座實不知也偉令擊鐘集衆白曰昧心欺衆他人猶不可為況首座以分座授道是老師所賞之職而自破壞乎二人俱受罰出院由此衆服其公泰後嗣法住黃檗山首座住溈山嗣黃龍禪師出僧寶傳隳毀也夙興早起也參會夜晚小參省會也貪叨求之不足曰貪嗜之不足曰叨高菴住雲居每見衲子室中不契其機者即把其袂正色責之曰父母養汝身師友成汝志無饑寒之迫無征役之勞於此不堅確精進成辦道業他日何面目見父母師友乎衲子聞其語有泣涕而不已者其號令整嚴如此且菴逸事袂音眉衣袂也袖也征役軍差曰征民差曰役高菴住雲居聞衲子病移延壽堂咨嗟歎息如出諸己朝夕問候以至躬自煎煮不嘗不與食或遇天氣稍寒拊其背曰衣不單乎或值時暑察其色曰莫太熱乎不幸不救不問彼之有無常住盡禮津送知事或他辭高菴叱之曰昔百丈為老病者立常住爾不病不死也四方識者高其為人及退雲居過天台衲子相從者僅五十輩間有不能往者泣涕而別蓋其德感人如此山堂小參延壽堂撫安老病之所也古者叢林老僧送安樂堂病者送延壽堂也即今涅槃堂是不幸不救乃天命將盡而不能救也高菴退雲居圓悟欲治佛印臥龍菴為燕休之所高菴曰林下人苟有道義之樂形骸可外豫以從心之年正如長庚曉月光影能幾時且西山廬阜林泉相屬皆豫逸老之地何必有諸己然後可樂邪未幾即拽杖過天台後終於華頂峰真牧集佛印南康軍雲居佛印了元禪師嗣開元善暹禪師燕休大學曰燕居獨處也論語云子之燕居從心孔子曰吾十有五而志於學三十而立四十而不惑五十而知天命六十而耳順七十而從心所欲不踰矩注曰從者凡事隨心所欲不過法度也長庚星明也東有啓明曰金星西有長庚曰水星金星在西日出則現水星在東日沒則現又先日而出曰啓明後日而沒謂之長庚也曉月言其二十七八之月才出則天曉矣所謂光景不長若此矣高菴曰衲子無賢愚惟在善知識委曲以崇其德業歷試以發其器能旌獎以重其言優愛以全其操歲月積久聲實並豐蓋人皆含靈惟勤誘致如玉之在璞抵擲則瓦石琢磨則圭璋如水之發源壅閼則淤泥疏濬則川澤乃知像季非獨遺賢而不用其於養育勸獎之道亦有所未至矣當叢林殷盛之時皆是季代棄材在季則愚當興則智故曰人皆含靈惟勤誘致是知學者才能與時升降好之則至獎之則崇抑之則衰斥之則絶此學者道德才能消長之所由也與李都運書旌獎上表顯也下勸獎也璞藏玉之石也抵擲拋棄也琢磨治玉石者既琢而復磨之言其已精而益求其精也圭璋瑞玉也上圓下方公執桓圭九寸侯執信圭伯執躬圭皆七寸也閼音遏塞也濬音峻深也殷大也高菴曰教化之大莫先道德禮義住持人尊道德則學者尚恭敬行禮義則學者耻貪競住持有失容之慢則學者有凌暴之弊住持有動色之諍則學者有攻鬬之禍先聖知於未然遂選明哲之士主於叢林使人具瞻不喻而化故石頭馬祖道化盛行之時英傑之士出威儀柔嘉雍雍肅肅發言舉令瞬目揚眉皆可以為後世之範模者宜其然矣與死心書恭敬恭現於外敬存於內失容無恭敬之容顯我慢之相諭曉也唐石頭南嶽石頭希遷禪師瑞州高安陳氏子嗣清原行思禪師後於衡嶽寺之東有石狀如臺結菴居之也瞬動目也高菴曰先師嘗言行腳出關所至小院多有不如意事因思法眼參地藏明教見神鼎時便不見有煩惱也記聞法眼金陵清凉院文益禪師餘杭魯氏子嘗與悟空修山主行腳至福州湖外值天雨忽作溪流瀑漲暫寓城西地藏院阻雪少憩附爐次琛曰上座何往師曰迤邐行腳曰行腳事作麼生師曰不知曰不知最親切師豁然大悟遂嗣其法後創法眼宗是也地藏漳州羅漢院圭琛禪師當山李氏子嗣玄沙師備禪師後漳州牧主請住地藏院次遷羅漢院破屋壞垣師恬然自樂也明教見神鼎嵩禪師見神鼎鼎坐其堂上嵩展具敬禮鼎指堂上兩小瓮曰子來是其時寺中今年始有醬食至明時食粥見一淨人挾筐取物投僧鉢中嵩視上下有咀嚼者有置之自若者嵩袖之下堂看乃碎米餅餌嵩問於耆宿宿曰此寺自來不煮粥有檀越請齊日次第撥僧赴之剩其乾殘者歸納庫中無齊之日令碎焙均而分之表同甘苦也高菴表裏端徑風格凜然動靜不忘禮法在衆日屢見侵害殊不介意終身以簡約自奉室中不妄許可稍不相契必正色直辭以裁之衲子皆信服嘗曰我道學無過人者但平生為事無愧於心耳風格氣象度量凜然色莊敬畏殊絶也介在也動也裁制也謂使學者至於無過不及之地而終成大德也高菴住雲居見衲子有攻人隱惡者即從容諭之曰事不如此林下人道為急務和乃修身豈可苟縱愛憎壞人行止其委曲如此師初不赴雲居命佛眼遣書勉云雲居甲于江左可以安衆行道似不須固讓師曰自有叢林已來學者被遮般名目壞了節義者不為不少佛鑒聞之曰高菴去就衲子所不及記聞甲首也以十千言之而甲居首乃雲居為江南十剎之首也去就見處也行事也高菴勸安老病僧文曰貧道嘗閲藏教諦審佛意不許比丘坐受無功之食生懶惰心起吾我見每至晨朝佛及弟子持鉢乞食不擇貴賤心無高下使得福者一切均溥後所稱常住者本為老病比丘不能行乞者設非少壯之徒可得而食逮佛滅後正法世中亦復如是像季以來中國禪林不廢乞食但推能者為之所得利養聚為招提以安廣衆遂輒逐日行乞之規也今聞數剎住持不識因果不安老僧背戾佛旨削弱法門苟不住院老將安歸更不返思常住財物本為誰置當推何心以合佛心當推何行以合佛行昔佛在日或不赴請留身精舍偏巡僧房看視老病一一致問一一辦置仍勸請諸比丘相恭敬隨順方便去其嗔嫌此調御師統理大衆之楷模也今之當代恣用常住資給口體結托權貴仍隔絶老者病者衆僧之物掩為己有佛心佛行渾無一也悲夫悲夫古德云老僧乃山門之標榜也今之禪林百僧之中無一老者老而不納益知壽考之無補反不如夭死願今當代各遵佛語紹隆祖位安撫老病常住有無隨宜供給無使愚昧專權滅裂致招來世短促之報切宜加察招提梵語招鬪提奢略云招提唐言四方僧物今稱十方常住也削弱上減損也下衰敗也謂顛沛祖風有傷法化也精舍精修梵行之所乃行人棲心修道之處也調御師化物不暴曰調御三界模範曰師滅裂輕薄也覺範和尚題靈源門榜曰靈源初不願出世隄岸甚牢張無盡奉使江西屢致之不可久之翻然改曰禪林下衰弘法者多假我偷安不急撑拄之其崩頺跬可須也於是開法於淮上之太平豫時東遊登其門叢林之整齊宗風之大振疑百丈無恙時不減也後十五年見此榜於逢原之室讀之凜然如見其道骨山谷為擘窠大書其有激云嗚呼使天下為法施者皆遵靈源之語以住持則尚何憂乎祖道不振也哉傳曰人能弘道非道弘人靈源以之石門集靈源門榜其略曰惟清名字住持實同寄客但以領徒弘法仰助教風為職事爾若其常住財物既非己有理不得專悉委職事僧徒分局主執照依公私合同支破惟清止同衆僧齊襯隨身瓶鉢任緣而住伏望四方君子來有所需惟顧𥨊食祇接之餘別難應供若其世法則屬官物若其佛法則為衆財偷衆財盜官物買悅人情則實非素分志之所敢當預具白文冀垂鑑察也張無盡丞相張商英字天覺號無盡十九登第後深信佛乘留心祖道宋哲宗元祐六年為江西漕運使後得法於兜率從悅禪師屢致上頻數也下請舉也可許也肯也翻然變動之貌假我偷安佛去世逾遠教以季末何得無邪之輩寄身於我教中苟且偷安其生也跬丘癸切半步也恙病也凜骨寒驚懼之貌擘窠上分也下字眼之方楷也人能弘道弘廓大也人外無道道外無人然人心有覺道體無為故人能弘道道不能弘人子張曰心能盡性人能弘道也性不能檢其心道不能弘其人也歸雲本和尚辨篇曰本朝富鄭公弼問道于投子顒禪師書尺偈頌凡一十四紙於台之鴻福兩廊壁間灼見前輩主法之嚴王公貴人信道之篤也鄭國公社稷重臣晚年知向之如此而顒必有大過人者自謂於顒有所警發士夫中諦信此道能忘齒屈勢奮發猛利期於徹證而後已如楊大年侍郎李和文都尉見廣慧璉石門聰并慈明諸大老激揚酬唱班班見諸禪書楊無為之於白雲端張無盡之於兜率悅皆扣關擊節徹證源底非苟然者也近世張無垢侍郎李漢老參政呂居仁學士皆見妙喜老人登堂入室謂之方外道友愛憎逆順雷揮電掃脫略世俗拘忌觀者斂袵辟易罔窺涯涘然士君子相求於空間寂寞之濵擬棲心禪寂發揮本有而已後世不見先德楷模專事諛媚曲求進顯凡以住持薦名為長老者往往書刺以稱門僧奉前人為恩府取招提之物苞苴獻識者憫笑而恬不知耻嗚呼吾沙門釋子一瓶一鉢雲行鳥飛非有凍餒之迫子女玉帛之戀而欲折腰擁篲酸寒局蹐自取辱賤之如此邪稱恩府者出一己之私無所依據一妄庸唱之於其前百妄庸和之於其後擬爭奉之真卑小之耳削弱風教莫甚於人實姦邪欺僞之漸雖端人正士巧為其所入則陷身於不義失德於無救可不哀歟破法比丘魔氣所鍾誑誕自若詐現知識身相指禪林大老為之師承媚當路貴人為之宗屬申不請之敬啓壞法之端白衣登床膜拜其下曲違聖制大辱宗風吾道之衰極至於此嗚呼天誅鬼録萬死奚贖非者歟嵩禪師原教有云古之高僧者見天子不臣預制書則曰公曰師鍾山僧遠鸞輿及門而床坐不迎虎溪惠遠天子臨潯陽而詔不出山當世待其人尊其德是故聖人之道振後世之慕其高僧者交卿大夫尚不得預下士之禮其出其處不若庸人之自得也況如僧遠之見天子乎況如慧遠之自若乎望吾道興吾人之修其可得乎存其教而不須其人存諸何以益乎惟此未嘗不涕下淳熙丁酉余謝事顯恩寓居平田西山小塢以日近見聞事多矯僞古風凋落吾言不足為之重輕聊書以自警云叢林盛事歸雲本撫州踈山歸雲如本禪師本州台城人嗣靈隱惠遠禪師南嶽下十六世富鄭公丞相富弼字彥國河南府人宋仁宗拜為鄭國公諡文忠定公得法於投子修顒也致仕洛陽以書答蘇州圓照本禪師云曾見顒師悟入深因緣傳得老師心東南謾說江山遠目覩靈光演妙音投子顒舒州投子悟證修顒禪師嗣慧林宗本禪師清原下十二世也豎石記功曰灼昭然也篤誠也厚也社稷社土神稷穀神建國則立壇壝以祀蓋國以安民為本社稷亦為民而立君之尊係於二者之存亡忘齒不拘年齒屈勢不拘名位之謂也楊大年宋楊億字大年建州蒲城人諡文正公官至翰林得法於廣慧元璉禪師後於仁宗康定間與慈明為友李和文駙馬都尉李遵勗號和文居士得法於谷隱蘊聰禪師初參聰時聰以崔趙公問徑山公案答之公於言下有省呈頌曰學道須是鐵漢著手心頭便判直取無上菩提一切是非莫管後與慈明為方外友廣慧璉汝州廣慧院元璉禪師泉州陳氏子嗣首山念禪師南嶽下九世也激揚激發也揚舉也激濁揚清之義也謂混濁者激發之使自勉清潔者舉揚之使易見班班明也件也兜率悅隆興府兜率寺從悅禪師贛州熊氏子嗣真淨文禪師南嶽下十三世也扣關擊節扣關緊要處難過而能過擊節阻隔處不通而能通也謂扣其機關擊其節要提持祖印顯露真機於節要處敲擊使其慶快也苟然豈徒然也張無垢侍郎張九成字子韶號無垢居士杭州鹽官人得法于妙喜杲禪師李漢老參政李邴字漢老得法于妙喜禪師呂居仁姓呂名本中字居仁問道于妙喜杲禪師官至翰林入室學者請益問道咨決心疑於禪奧之室也方外友出塵勞方隅之外脫凡情拘係之中故謂方外友也雷揮電掃雷揮則激散長空電掃則蕩除妖蘖蓋情愛順逆逈然清淨也袵衣襟也辟易惶悚失守之貌涯涘水之邊際也言其不能測度也擬度也書刺下音七古來未有紙削竹木以書其名姓恬安靜也餒奴罪切饑也折腰折腰之勢晉時陶潛字淵明號元亮門栽五柳自號五柳先生為彭澤令性簡貴不私事上官一日遣督郵至縣吏謂應束帶見之淵明歎曰吾豈能為五斗米折腰向鄉里小兒即日解綬去職賦歸去來辭擁篲掃地之形也漢高祖即位五日一朝太公以父子禮待之其家令謂太公曰高祖雖子人主也太公雖父人臣也奈何以人主而拜人臣如此則威重不行矣後高祖朝太公公擁篲迎門却行高祖大驚下扶太公公曰帝人主也奈何以我亂天下之法於是尊太公為太上皇酸寒言怖畏之勢身酸心寒局蹐上曲身也下纍足小步也謂人恐懼其身不敢伸足不敢放諂勢如此也鍾聚也申明也呈也膜拜長跪也誅明其罪而殺之曰誅録收録其名而考其罪曰録贖納金免罪曰贖僧遠齊高祖建元元年八月有事駕臨鍾山因幸沙門僧遠帝訪之遠床坐辭老疾不迎高祖將詣床下見之左右曰房榻窄狹不能容輿蓋遂駐輦殷勤致問而去慧遠廬山東林虎溪慧遠禪師雁門樓煩賈氏子博通六經尤邃周易嘗與弟慧持造安法師席下聞說般若經喜歎曰儒道九流特糠粃耳遂祝髮出家以大法為己任及關中擾亂師南遊至潯陽見匡山愛之結廬山中太守桓尹尊其道德為創精舍時晉室衰微天下奇才隱居不仕師結蓮社會諸賢儒并沙門千餘人求生淨土東晉安帝駕臨潯陽詔遠一出師辭以老疾不出帝愈加敬勑九江太守歲時送資道之具卜居三十年影不出山凡送客以虎溪橋為限著匡山集三十卷圓極岑和尚跋云佛世之遠正宗淡薄澆漓風行無所不至前輩凋謝後生無聞叢林典刑幾至掃地縱有扶救之者返以為王蠻子也今觀疏山本禪師辨詞遠而意廣深切著明極能針其病苐妄庸輩智識暗短醉心於邪之域必以醍醐為毒藥也叢林盛事圓極岑太平州隱靜圓極彥岑禪師撫州台城人嗣雲居法如禪師南嶽下十六世也跋前曰序後曰跋典刑孟子曰太甲顛覆湯之典刑乃謂聖人正暴除亂徵惡除非勸善之法度也幾近也將也掃地乃教之倒敗也王蠻子乃方語是法門中奴僕也針規誡也亦作藥針能除毒病也醉沉酣也東山空和尚答余才茂借腳夫書云向辱枉顧荷愛之厚別後又承惠書益自感愧某本巖穴閒人與世漠然才茂似知之今雖作長老居方丈只是前日空上座常住有無一付主事出入支籍並不經眼不蓄衣鉢不用常住不赴外請不求外援任緣而住初不作明日計才茂既以道舊見稱故當相忘於道今書中就覓數腳夫不知此腳出於常住邪空上座邪若出於空空亦何有若出常住是私用常住一涉私則為盜豈有善知識而盜用常住乎公既入帝鄉求好事不宜於寺院營此等事公閩人所見所知皆閩之長老一住著院則常住盡盜為己有或用結好貴人或用資給俗家或用接陪己知殊不念其為十方常住招提僧物也今之戴角披毛償所負者多此等人先佛明言可不懼哉比年以來寺舍殘廢僧徒寥落皆此等咎願公勿置我於此等輩中公果見信則他寺所許者皆謝而莫取則公之前程未可量也逆耳之言不知以謂如何時寒途中保愛語録東山空福州雪峰東山惠空禪師本郡陳氏子嗣泐潭善清禪師南嶽下十四世幼歲圓頂披緇振錫遊方契悟於草堂開法於雪峰也援助也忘於道莊子大宗師篇孔子云魚相忘於江湖鳥相忘於虗空人相忘於道術注云水深游泳魚得其樂故相忘道濶無涯物我俱泯人得其樂故相忘也閩今福建也償負上還也受貸不償曰負浙翁琰和尚云此書真閻老子殿前一本赦書也今之諸方道眼不知若何果能受持此書則他日大有得力處浙翁每以此舉似於人璨隱山亦云常住金穀除供衆之外幾如鳩毒住持人與司其出入者才霑著則通身潰爛律部載之詳矣古人將錢就庫下回生薑煎藥蓋可見今之踞方丈者非特刮衆人鉢盂中物以恣口腹且將以追陪自己非泛人情又其甚則剜去搜買珍奇廣作人情冀遷大剎只恐他日鐵面閻老子與計算哉拈崖漫録浙翁琰金陵鍾山如琰禪師號浙翁未詳法嗣赦有罪全放曰赦璨隱山未詳古人瑞州洞出自寶禪師廬州人嗣五祖戒禪師清源下九世為人嚴謹嘗在五祖為庫司戒病令侍者往庫中取生薑煎藥寶叱之侍者白戒戒令取錢回賈寶方取薑與之後筠州洞山缺住持郡守以書托戒所舉智者主之戒曰賣生薑漢住得遂出世住洞山後移歸宗寺一日出門見喝道者來師問甚麼官從曰縣尉令避路寶側立道左避之馬忽見跪而不行寶曰畜生却識人尉知是寶再拜而去後遷雲居一夜山神肩輿繞寺行寶曰擡你爺娘擡上方丈去寶初行腳時嘗宿旅邸為娼女所窘遂讓榻與之睡寶夜危坐至旦娼女索宿錢寶與之出門將火自燒其褥而去娼女以實告母遂請師置齊求懺謂真佛子也嘗作達磨讚最播叢林琅琊覺和尚知之今載正法眼藏中踞大座居也泛多也浮也剎梵語剎瑟此云竿即幡柱也凡沙門得道者建幡以告四方出要覽音切殢大計切其舉切詰溪吉切虻陌庚切扼於革切腕烏段切礲力公切砥底音覬羈致切覦庾俱切駑乃呼切紿徒愷切昺景切媟思列切昵女栗切隄下兮切防扶方切隳許規切叨他刀切閼烏割切跬羌規切篲詳惠切澆公堯切漓呂支切閩貧切琰弋冉切刮古猾切剜於丸切
