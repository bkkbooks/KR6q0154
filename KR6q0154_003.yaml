body:
  text: 虎林淨慧居士張文嘉仲嘉甫較定雪堂行和尚住薦福一日問暫到僧甚處來僧云福州來雪堂云㳂路見好長老麼僧云近過信州博山住持本和尚雖不曾拜識好長老也雪堂曰安得知其為好僧云入寺路徑開闢廊廡修整殿堂香燈不絕晨昏鐘皷分明二時粥飯精潔僧行見人有禮以此知其為好長老雪堂笑曰本固賢矣然爾亦具眼也直以斯言達于郡守吳公傅朋曰遮僧持論頗類范延齡薦張希顏事而閣下之賢不減張忠定公老僧年邁乞請本住持庶幾為林下盛事吳公大喜本即日遷薦福東湖集范延齡事出皇朝類苑雪堂行衢州烏巨山雪堂道行禪師迅州葉氏子嗣佛眼遠禪師南嶽下十五世沿從流而下也今謂從一路也博山本饒州薦福悟本禪師江州人前住博山嗣大慧禪師南嶽下十六世入寺下六條路徑開濶居處好廊廡修整建立好香燈不絕報恩好鐘皷分明法令好粥飯精潔恩眾好僧行有禮規矩好張希顏事宋時張希顏為萍鄉邑宰范延齡為殿直押兵過金陵張詠上命知金陵事問曰天使沿路見好官員麼曰昨過萍鄉邑宰張希顏好官員也詠曰焉得知其為好答曰自入其境橋路完美田園濶闢野無墮農市無賭博夜聞更皷分明必知有美政者詠曰希顏固賢矣天使亦好官員即日同薦於朝希顏為發運使延齡為閣門侯也張詠字復之後封定國公閣下稱呼之辭又語錄云宰相三公郡守俱稱閣下雪堂曰金隄千里潰於蟻壞白璧之美離於瑕玷況無上妙道非特金隄白璧也而貪慾瞋恚非特蟻壞瑕玷也要在志之端謹行之精進守之堅確修之完美然後可以自利而利他也與五十朋書金隄上取堅固之義下乃池塘之岸潰散也雪堂曰予在龍門時昺鐵面住太平有言昺行脚離鄉未久聞受業一夕遺火悉為煨燼昺得書擲之於地乃曰徒亂人意耳東湖集煨燼下音儘即火之餘也雪堂謂晦菴光和尚曰予弱冠之年見獨居士言中無主不立外不正不行此語宜終身踐之聖賢事業備矣予佩其語在家修身出家學道以至率身臨眾如衡石之定重輕規矩之成方圓捨此則事事失準矣廣錄見獨居士者即雪堂父也晦菴光信州龜峰晦菴惠光禪師建寧人嗣雪堂行機禪師弱冠古者二十歲方冠此十五六未冠之稱也佩大帶也又凡帶必有佩古人凡遇善行嘉言即書於佩示其不忘也準法則也又準者所以揆平馭正註曰立水以望繩以水為平即是為平之器雪堂曰高菴臨眾必曰眾中須知有識者予因問其故高菴曰不見溈山道舉措看他上流莫謾隨於庸鄙平生在眾不沈於下愚者皆出此語稠人廣眾中鄙者多識者少鄙者易習識者難親果能自奮志於其間如一人與萬人敵庸鄙之習力盡真挺特沒量漢也予終身踐其言始得不負出家之志廣錄謾空也欺也挺持超越而獨立也雪堂謂且菴曰執事須權重輕發言要先思慮務合中道勿使偏頗若倉卒暴用鮮克有濟就使得成而終不能萬全予在眾中備見利病惟有德者以寬服人常願後來有志力者審而行之方為美利靈源甞曰凡人平居內照多能曉了及涉事外馳便乖混融喪其法體必欲思紹佛祖之任啟廸後昆不可不常自檢責也廣錄且菴真州長蘆且菴守仁禪師越之上虞人嗣雪堂行禪師南嶽下十六世也頗不正之貌啟廸開導也應菴華和尚住明果雪堂未甞一日不過從間有竊議者雪堂曰華侄為人不悅利近名不先譽後毀不阿容苟合不色巧言加以見道明白去住翛然衲子難得予固重之且菴逸事應菴華明州天童應菴曇華禪師蘄州汪氏子嗣虎丘隆禪師南嶽下十六世雪堂曰學者氣勝志則為小人志勝氣則為端人正士氣與志齊為得道賢聖有人剛狼不受規諫氣使然也端正之士雖強使為不善寧死不二志使然也廣錄志氣上心志也下血氣也以理養心志不昏以志帥氣氣不墮論云氣聽命於心者是賢也心聽命於氣者為小人也夫氣者志之卒也志者氣之帥也苟心隨氣變則氣反為志之帥也氣為帥則吾心之志衰斯乃心為氣役也聖賢君子以心御氣而不為氣所御以心移氣而不為氣所移也雪堂曰高菴住雲居普雲圓為首座一材僧為書記白楊順為藏主通烏頭為知客賢真牧為維邪華侄為副寺用侄為監寺皆是有德業者用侄尋常廉約不點常住油華侄因戲之曰異時做長老須是鼻孔端正始得豈可以此為得耶用侄不對用侄處己雖儉與人甚豐接納四來略無倦色高菴一日見之曰監寺用心固難得更須照管常住勿令疎失用侄曰在某失為小過在和尚尊賢待士海納山容不問細微誠為大德高菴笑而已故叢林有用大碗之稱逸事普雲圓南康軍普雲自圓禪師綿州雍氏子嗣南菴悟禪師南嶽下十六世首座表率叢林人天眼目分座說法開鑿後昆故曰首座也一材僧未詳或指水菴書記執掌文翰凡山門榜疏書簡祈禱語詞悉皆屬之白楊順撫州白楊法順禪師綿州文氏子嗣佛眼遠禪師南嶽下十五世也師一日上堂曰好事堆堆疊疊來不須造作與安排落林黃葉水摧去橫谷白雲風捲回寒雁一聲情念斷霜鐘纔動我山摧白楊更有過人處盡夜寒爐撥死灰藏主執掌經藏兼通義理函帙目錄常加典對缺者補完斷者粘綴也通烏頭真州北山法通禪師嗣長蘆了清禪師知客知典賓客緇白相遇應對香茶迎請務令整齊賢真牧南康軍歸宗真牧正賢禪師潼州陳氏子嗣佛眼遠禪師南嶽下十五世維那綱維僧眾曲盡調攝僧事內外無不掌之維那華梵兼舉即今之悅眾也副事掌常住金糓錢帛米麥出入隨時上曆也用侄婺州雙林德用禪師本郡戴氏子嗣高菴善悟禪師監寺梵語摩監帝此云寺主即今監寺此職早暮勤事香火應接官員歷事廉能公謹上下無怨者充之矣海納山容量如大海無水不納心似山谷無物不容也雪堂曰學者不知道之所向則尋師友以參扣之善知識不可以道之獨化故假學者贊祐之是以主招提有道德之師而成法社必有賢智之衲子是為虎嘯風冽龍驤雲起昔江西馬祖因百丈南泉而顯其大機大用南嶽石頭得藥山天皇而著其大智大能所以千載一合論說無疑翼然若鴻毛之遇風沛乎似巨魚之縱壑皆自然之勢也遂致建叢林功勳增佛祖光耀先師住龍門一夕謂予曰我無德業不能浩歸湖海衲子終愧老東山也言畢澘然予甞思之今為人師法者與古人相去倍萬矣與竹菴書贊祐佐助也社席也會也嘯吹氣之聲冽寒氣也驤騰躍遠舉之貌虎嘯龍驤易乾卦九五飛龍在天利見大人何謂也子曰同聲相應同氣相求水流濕火就燥雲從龍風從虎聖人作而萬物覩本乎天者親乎上本乎地者親乎下則各從其類也藥山澧州藥山惟儼禪師絳州韓氏子嗣石頭遷禪師天皇荊州天皇道悟禪師婺州東陽張氏子嗣石頭禪師翼飛舉之貌鴻大雁也沛水流下急之貌潸音山淚下之貌雪堂曰予在龍門時靈源住太平有司以非意擾之靈源與先師書曰直可以行道殆不可為枉可以住持誠非我志不如放意於千巖萬壑之間日飽蒭粟以遂餘生復何惓惓乎不旬浹間有黃龍之命乃乘興歸江西聰首座記聞直枉行道直道而事人焉往而不三黜枉道而事人何必去父母之此魯論中柳下惠語也蒭粟草子之飯也惓惓憂問也旬浹下音節十日為旬十二日為浹也雪堂曰靈源好比類衲子曰古人有言譬為土木偶人相似為木偶人耳鼻先欲大口目先欲小人或非之耳鼻大可以小口目小可以大為土偶人耳鼻先欲小口目先欲大人或非之耳鼻小可以大口目大可以小夫此言雖小可以喻大矣學者臨事取捨不厭三思可以為忠厚之人也記聞偶象人之形曰偶雪堂曰萬菴送高菴過天台回謂予言有德貫首座隱景星巖三十載影不出山龍學耿公為郡特以瑞巖迎之貫辭以偈曰三十年來獨掩關使符那得到青山休將𤨏末人間事換我一生林下閒使命再至終不就耿公嘆曰今日隱山之流也萬菴曰彼有老宿能記其語者乃曰不體道本沒溺死生觸境生心隨情動念狼心狐意諂行誑人附勢阿容狥名苟利乖真逐妄背覺合塵林下道人終不為也予曰貫亦僧中間氣也逸事萬菴江州東林萬菴道顏禪師潼州解氏子嗣大慧杲禪師南嶽下十六世也貫首座未詳使符漢制以竹長六寸分而相合為符信也狼多貪害物曰狼間氣不世而出曰間氣如伊尹周公之類也又謂出格之人與世無干也雪堂生富貴之室無驕倨之態處躬節儉雅不事物住烏巨山衲子有獻鐵鏡者雪堂曰溪流清泚毛髮可鑑蓄此何為終却之行實富貴有財曰富有祿曰貴泚千里切水清也雪堂仁慈忠恕尊賢敬能戲笑俚言罕出于口無峻阻不暴怒至於去就之際極為介潔甞曰古人學道于外物淡然無所嗜好以至忘勢位去聲色似不勉而能今之學者做盡伎倆終不奈何其故何哉志不堅事不一把作匹似間耳行實忠恕盡己之謂忠讓人之謂恕俚鄙俗之言介所守之節堅正不移伎倆能巧多藝也匹似間方語不要緊也雪堂曰死心住雲巖室中好怒罵衲子皆望崖而退方侍者曰夫為善知識行佛祖之道號令人天當視學者如赤子今不能施慘怛之憂垂撫循之恩用中和之教奈何如仇讐見則詬罵豈善知識用心乎死心拽拄杖趂之曰爾見解如此他日諂奉勢位苟媚權豪賤賣佛法欺罔聾俗定矣予不忍故以重言激之安有他哉欲其知耻改過懷慕不忘異日做好人耳聰首座記聞方侍者吉州禾山超宗惠方禪師嗣黃龍禪師南嶽下十二世慘怛慈悲之容惻隱之貌撫循上安也下順也乃屈尊就卑之義也中和理無偏頗事無緩急又喜怒哀樂之未發謂之中發而皆中節謂之和讐懷冤相報之意不容寬恕之心詬音后怒也趂逐也權豪當位有勢曰權財力俱勝曰豪激之感發其志死心新和尚曰秀圓通甞言自不能正而欲正他人者謂之失德自不能恭而欲恭他人者謂之悖禮夫為善知識失德悖禮將何以垂範後乎與靈源書秀圓通汴梁法雲寺圓通法秀禪師秦州隴城辛氏子嗣天衣懷禪師清源下十一世死心謂陳瑩中曰欲求大道先正其心少有忿懥則不得其正少有嗜慾亦不得其正然自非聖賢應世安得無愛惡喜怒直須不置之於前以害其正是為得矣廣錄忿懥下本作睫字上怒之甚也下怒之滯也死心曰節儉放下最為入道捷徑多見學者心憤憤口悱悱孰不欲繼踵古人及觀其放下節儉萬中無一恰似世俗之家子弟不肯讀書要做官人雖三尺孺子知其必不能為也廣錄憤憤心欲通而未能通也悱悱口欲言而未能言也死心謂湛堂曰學者有才識忠信節義者上也其才雖不高謹而有量者次也其或懷邪觀望隨勢改易此真小人也若置之於人前必壞叢林而汙瀆法門也實錄死心謂草堂曰凡住持之職發言行事要在誠信言誠而信所感必深言不誠信所感必淺不誠之言不信之事雖平居庶俗猶不忍行恐見欺于鄉黨況為叢林主代佛祖宣化發言行事苟無誠信則湖海衲子孰相從焉黃龍實錄鄉黨一萬二千家為鄉五百家為黨死心曰求利者不可與道求道者不可與利古人非不能兼之葢其勢不可也使利與道兼行則商賈屠沽閭閻負販之徒皆能求之矣何必古人棄富貴忘功名灰心泯智于空山大澤之中㵎飲木食而終其身哉必謂利與道行之不相違礙譬如捧漏巵而灌焦釜則莫能濟矣因與韓子蒼書商賈下音古行商坐賈屠沽宰殺曰屠賣酒曰沽閭閻里巷之門負販上擔荷也下賤買貴賣也漏巵注酒之器也古云江河不能滿漏巵焦釜秦伐趙趙取救於齊齊不明周子曰今日亡趙明日患及齊救趙之急務宜若捧漏巵而沃焦釜死心曰晦堂先師昔遊東吳見圓照赴淨慈請蘇杭道俗爭之不已一曰此我師也汝何奪之一曰今我師也汝何有焉一本見林間錄圓照東京惠林寺圓照宗本禪師常州無錫管氏子嗣天衣義懷禪師清源下十一世也死心住翠巖聞覺範竄逐海外道過南昌邀歸山中迎待連日厚禮津送或謂死心喜怒不常死心曰覺範有德衲子鄉者極言去其圭角今罹橫逆是其素分予以平日叢林道義處之識者謂死心無私於人故如此西山記聞鄉與向同先也死心謂草堂曰晦堂先師言人之寬厚得於天性若強之以猛必不悠久猛而不久則返為小人侮慢然邪正善惡亦得于天性皆不可移惟中人之性易上易下可從而化之實錄草堂清和尚曰燎原之火生于熒熒壞山之水漏于涓涓夫水之微也捧土可塞及其盛也漂木石沒丘陵火之微也勺水可滅及其盛也焦都邑燔山林與夫愛溺之水瞋恚之火曷常異乎古之人治其心也防其念之未生情之未起所以用力甚微收功甚大及其情性相亂愛惡交攻自則傷其生他則傷其人殆乎危矣不可捄也與韓子蒼書草堂清隆興府草堂善清禪師南雍州何氏子嗣黃龍祖心禪師南嶽下十三世燎燒也熒熒小火星也都邑天子所居曰都周禮云四縣曰都邑國也四井曰邑燔音煩燒也草堂曰住持無他要在審察人情周知上下夫人情審則中外和上下通則百事理此住持所以安也人情不能審察下情不能上通上下乖戾百事矛盾此住持所以廢也其或主者自持聰明之資好執偏見不通物情捨僉議而重己權廢公論而行私惠致使進善之途漸隘任眾之道益微毀其未見未聞安其所習所蔽欲其住持經大傳遠是猶却行而求前終不可及與山堂書僉眾也皆也却行求前時孔子在衛冉求言於季孫曰國有聖人而不能用欲求其治是猶却行而求前豈可及乎草堂曰學者立身須要正當勿使人竊議一涉異論則終身不可立矣昔大陽平侍者道學為叢林推重以處心不正識者非之遂致終身坎坷逮死無歸然豈獨學者而已為一方主人尤宜祗畏與一書記書平侍者太陽平侍者預明安之室有年矣雖盡得其旨惟以生滅為己任擠陷同列忌出其右時瑯琊廣照公安圓鑑居眾時汾陽昭禪師令其探明安宗旨太陽明安云興洞山一宗非遠即覺也二師云有平侍者在安以手指胷云此處不佳又揑拇指叉中示云平向去當死於此爾既明安遷化遺囑云瘞身十年無難當為太陽山打供入塔時門人恐平將不利於師遂作李和文都尉所施黃白器物書於塔銘實無也後平住太陽忽云先師靈骨風水不利取而焚之山門耆宿切諫平云與我有妨遂發塔見師顏貌如生薪盡儼然眾皆驚異平以钁破其腦益油薪俄成灰燼眾以其事聞於官坐平謀塔中物不孝還俗平後自稱為黃秀才謁瑯琊瑯瑯曰昔年平侍者今朝黃秀不我在太陽時見你做出來遂不納又謁公安安亦然平流浪無依後于三叉路口遭大虫食之竟不免太陽手叉之記悲哉坎坷不平之貌草堂謂如和尚曰先師晦堂言稠人廣眾中賢不肖接踵以化門廣大不容親疎於其間也惟在少加精選苟才德合人望者不可以己之所怒而疎之苟見識庸常眾人所惡者亦不可以己之所愛而親之如此則賢者自進不肖者自退叢林安矣若夫主者好逞私心專己喜怒而進退於人則賢者緘默不肖者競進紀綱紊亂叢林廢矣此二者實住持之大體誠能審而踐之則近者悅而遠者傳則何慮道之不行衲子之不來慕乎疎山石刻親疎愛而近之曰親惡而遠之曰疎緘默上封也下不言也時孔子觀周入后稷之廟有金人焉三緘其口而銘其背曰天機不密四時何行地機不密萬物何生人機不密萬事何成此古慎言之人也又誡人之避纔草堂謂空首座曰自有叢林已來得人之盛無如石頭馬祖雪峰雲門近代唯黃龍五祖二老誠能收拾四方英俊衲子隨其器度淺深才性能否發而用之譬如乘輕車駕駿駟總其六轡奮其鞭策抑縱在其顧盻之間則何往而不達哉廣錄雪峰福州雪峰義存禪師南安曾氏子嗣德山宣鑑禪師雲門廣東韶州雲門山光峰院文偃禪師嘉興張氏子嗣雪峰義存禪師俊智過千人曰俊駕駿駟四馬在軛曰駕俊馬曰駿一乘四馬曰駟六轡下普具切車有四馬各兩轡共八轡以驂馬內兩轡繫於軾驂馬外兩轡及夾轅兩服馬四轡分置兩手以為六轡䇿馬箠也以鞭擊馬也顧盻回視也草堂曰住持無他要在戒謹其偏聽自專之弊不主乎先入之言則小人諂迎合之纔不可得而惑矣葢眾人之情不一至公之論難見須是察其利病審其可否然後行之可也疎出實錄草堂謂山堂曰天下之事是非未明不得不慎是非既明以理決之惟道所在斷之勿疑如此則姦不能惑強辯不能移矣清泉記聞山堂震和尚初却曹山之命郡守移文勉之山堂辭之曰若使飯粱囓肥作貪名之衲子不若草衣不食為隱山之野人清泉才菴主記聞山堂隆興府黃龍山堂道震禪師金陵趙氏子嗣泐潭善禪師粱美糓也囓肥上噬也下肥膩也言所食者皆佳糓美味之物也山堂曰蛇虎非鴟鳶之讐鴟鳶從而號之何也以其有異心故牛豕非鸜鵲之馭鸜鵲集而乘之何也以其無異心故昔趙州訪一菴主值出生飯州云鵶子見人為甚飛去主罔然遂躡前語問州州對曰為我有殺心在是故疑於人者人亦疑之忘於物者物亦忘之古人與虵虎為伍者善達此理也老龐曰鐵牛不怕獅子吼恰似木人見花鳥斯言盡之矣與周居士書鴟充尸切亦名鳶似雁而白也鸜音劬鸜鵒也即八哥是也馭乘也罔然言不知其理也躡踐也伍聚也五人相參曰伍又伴也老龐襄州龐蘊字道玄衡陽縣人得法於馬祖甞作偈曰但自無心於萬物何妨萬物常圍遶鐵牛不怕獅子吼恰似木人見花鳥木人本體自無情花鳥逢人亦不驚心境如如只這是何慮菩提道不成山堂曰御下之法恩不可過過則驕矣威不可嚴嚴則怨矣欲恩而不驕威而不怨恩必施於有功不可妄加於人威必加於有罪不可濫及無辜故恩雖厚而人無所驕威雖嚴而人無所怨功或不足稱而賞之已厚罪或不足責而罰之至重遂使小人故生驕怨矣與張尚書書御治也使也驕矜肆辜罪犯應死曰辜山堂曰佛祖之道不過得中過中則偏邪天下之事不可極意極意則禍亂古今之人不節不謹殆至危亡者多矣然則孰無過歟惟賢達之士改之勿吝是稱為美也與趙超然書山堂同韓尚書子蒼萬菴顏首座賢真牧避難于雲門菴韓公因問萬菴近聞被李成兵吏所執何計得脫萬菴曰昨被執縛饑凍連日自度必死矣偶大雪埋屋其所繫屋壁無故崩倒是夜幸脫者百餘人公曰正被所執時如何排遣萬菴不對公再詰之萬菴曰此何足道吾輩學道以義為質有死而已何所懼乎公頷之因知前輩涉世禍害死生皆有處斷矣真牧集韓子蒼名駒字子蒼問道於山堂道震禪師任至尚書李成南宋高宗紹興元年李成作亂聚集浙江各處賊宼十餘萬戰據江淮十餘州自號李天王劫掠襄陽遇岳飛殺敗投入江者不知其數李成敗走投金自此襄漢悉平川陝道路方通徵稅無阻矣詰問山堂退百丈謂韓子蒼曰古之進者有德有命故三請而行一辭而退今之進者惟勢與力知進退而不失其正者可謂賢達矣記聞三請一辭古語云三讓而進一辭而退言士之自重也山堂謂野菴曰住持存心要公行事不必出於己為是以他為非則愛惡異同不生於心暴慢邪僻之氣無自而入矣幻菴集野菴隆興府石亭野菴祖璇禪師嗣大慧宗杲禪師山堂曰李商老言妙喜器度凝遠節義過人好學不倦與老夫相從寶峰僅四五載十日不見必遣人致問老夫舉家病腫妙喜過舍躬自煎煑如子弟事父兄禮既歸元首座責之妙喜唯唯受教識者知其大器湛堂嘗曰杲侍者再來人也山僧惜不及見湛堂遷化妙喜蠒足千里訪無盡居士於渚宮求塔銘湛堂末後一段光明妙喜之力也日涉記李商老廬山李商老因修造動土觸犯土神致舉家病腫求醫不効乃焚香齋戒誦念熾盛光王神呪未及七日夜夢老人著白衣騎牛陷地旋沒而去翌日全家病瘞矣元首座成都府昭覺寺微菴道元禪師嗣佛果懃禪師南嶽下十五世唯唯上聲應之速而無疑也加唯唯兩字者順從之至也蠒足足重皮也楚欲伐宋墨子自魯趣楚十日十夜足腫如重蠒而不休息謂足傷起皮如重蠒也渚宮上音主地名即荊州府是也塔銘妙喜禪師因湛堂示寂請覺範狀其行實又得龍安照然禪師書為紹介特往荊州謁無盡居士求塔銘初見無盡問公祇任麼著草鞋遠來師曰某數百里特來見相公公曰年多少師曰二十四歲又問水牯牛多少師曰兩個公曰甚麼處學得虗頭言來師曰今日親見相公無盡笑曰且坐吃茶纔坐又問遠來有何事緣師趨前曰湛堂和尚示寂茶毗眼睛牙齒數珠不壞得舍利無數山門耆宿皆欲得相公大手筆作塔銘激厲後學特地遠來冐瀆鈞聽無盡曰被罪在此不曾為人作文字今有一問若道得即作塔銘道不得即與錢五貫裹足却歸兜率參禪去師云請相公問公曰聞準老眼睛不壞是否答曰是公曰我不問你這個眼睛師曰問甚麼眼睛公曰金剛正眼睛師曰若是金剛正眼睛在相公筆頭上公曰如此則老夫為他點出光明令他照天照地去也師乃趣前曰先師多幸謝相公塔銘無盡唯唯而笑其略曰舍利孔老之書無聞也先佛世尊滅度之後弟子收取舍利起塔供養趙州從諗禪師舍利多至萬粒近世龍慶閑百丈肅烟氣所及皆成舍利大體出家人本為生死事大若生死到來不知下落則不如三家村裏省事漢臨終囑付一一分明四大色身諸緣假合從本以來舍利豈有體性若梵行清潔白業堅固靈明廓徹預知報謝不驚不怖則依正二報毫𨤲不失若世間麗心於本分事上十二時中不曾照管微細流注生大我慢此是業主鬼來借宅如此而欲舍利流珠諸根不壞豈可得乎妙喜杲和尚曰湛堂每獲前賢書帖必焚香開讀或刊之石曰先聖盛德佳名詎忍棄置其雅尚如此故其亡也無十金之聚唯唐宋諸賢墨蹟僅兩竹籠衲子競相詶唱得錢八十餘千助茶毗禮可菴集十金即十兩也墨蹟下與跡同即書籍字帖也茶毗梵語此云火化妙喜曰佛性住大溈行者與地客相歐於口切捶也佛性欲治行者祖超然因言若縱地客摧辱行者非惟有失上下名分切恐小人乘時侮慢事不行矣佛性不聽未幾果有莊客弒知事者可菴集佛性潭州大溈佛性法泰禪師漢州李氏子嗣圓悟勤禪師南嶽下十五世也地客即佃戶也祖超然臨安府超然文祖禪師嗣天衣懷禪師清源下十一世也弒以下殺上曰弒妙喜曰祖超然住仰山地客盜常住糓超然素嫌地客意欲遣之令庫子行者為彼供狀行者欲保全地客察超然意抑令供起離狀仍返使呌喚不肯供責超然怒行者擅權二人皆決竹篦而已葢超然不知陰為行者所謀烏乎小人狡猾如此可菴集抑逼也狡猾奸頑多許也妙喜曰愛惡異同人之常情惟賢達高明不被其所轉昔圓悟住雲居高菴退東堂愛圓悟者惡高菴同高菴者異圓悟由是叢林紛紛然有圓悟高菴之黨竊觀二大士播大名于海上非常流可擬惜乎昧於輕信小人諂言惑亂聰明遂為識者笑是故宜其亮座主隱山之流為高上之士也智林集大士有德之稱謂當代英賢思拔羣類智出眾情弘道利生故曰大士也亮座主西蜀人頗講經論因參馬祖發明大事隱於洪州西山更無消息政和間有熊秀才遊西山過翠巖長老思文與秀才俱是鄱陽人故遣二力士擡籃輿送至所經林壑草木蔭翳偶見一僧貌古神清龐眉雪頂編葉為衣坐於盤石如壁間𦘕佛圓澄之狀熊自謂曰今時無這般僧甞聞亮座主隱於西山疑其猶在出輿踧踖而前曰莫是亮座主麼僧以手向東指熊方與二力隨手回視失僧所在時小雨初歇熊登石視其座處猶乾躊蹰回顧太息曰宿緣不厚雖遇而不遇也隱山潭州龍山禪師因參馬祖發明心要後隱潭州龍山一日泪山悟本與密師伯遊山前見溪流菜葉莫有道人居否遂撥草循溪行六七里忽見隱山在菴前便問此山無路闍黎從何處來洞曰無路且置和尚從何而入師曰我不從雲水來洞曰和尚住此山多少時節曰春秋不涉洞曰此山先住和尚先住師曰不知洞曰為甚麼不知師曰我不從人天來洞曰和尚得何道理便住此山師曰我見兩個泥牛鬪入海直至如今絕消息洞山良久具威儀禮拜便問如何是主中主師曰長年不出戶洞曰如何主中賓師曰青山覆白雲洞曰賓主相去幾何師曰長江水上波洞曰賓主相見有何言句師曰清風拂白雲洞山辭退乃述偈曰三間茅屋從來住一道神光萬境閑莫將是非來辯我浮生穿鑿不相關自此焚菴遁入深山幽寂之處不知所在因號隱山妙喜曰古人見善則遷有過則改率德循行思免無咎所患莫甚於不知其惡所美莫善於好聞其過然豈古人之才智不足識見不明而若是耶誠欲使後世自廣而狹於人者為戒也夫叢林之廣四海之眾非一人所能獨知必資左右耳目思慮乃能盡其義理善其人情苟或尊居自重謹細務忽大體賢者不知不肖者不察事之非不改事或是不從率意狂為無所忌憚此誠禍害之基安得不懼或左右果無可咨詢者猶宜取法於先聖豈可如嚴城堅兵無自而入耶此殆非所謂納百川而成大海也與寶和尚書率遵也修也妙喜曰諸方舉長老須舉守道而恬退者舉之則志節愈堅所至不破壞常住成就叢林亦主法者救今日之弊也且詐狡猾之徒不知羞耻自能諂奉勢位結托于權貴之門又何須舉與竹菴書恬退樂然而退不願為人妙喜謂超然居士曰天下為公論不可廢縱抑之不行其如公論何所以叢林舉一有道之士聞見必欣然稱賀或舉一不諦當者眾人必慽然嗟嘆其實無他以公論行與不行也烏乎用此可以卜叢林之盛衰矣可菴集超然居士郡王趙令矜字表之號超然居士都郡南康嗣圓悟勤禪師抑止也慽憂也妙喜曰節儉放下乃修身之基入道之要歷觀古人鮮有不節儉放下者年來衲子遊荊楚買毛褥過浙右求紡絲得不愧古人乎妙喜曰古德住持不親常住一切悉付知事掌管近代主者自恃才力有餘事無大小皆歸方丈而知事徒有其虗名耳嗟乎苟以一身之資固欲把攬一院之事使小人不蒙蔽紀綱不紊亂而合至公之論不亦難乎與山堂書蒙欺昧遮掩曰蒙妙喜曰陽極則陰生陰極則陽生盛衰相乘乃天地自然之數惟豐亨宜乎日中故曰日中則月滿則虧天地盈虧與時消息而況於人乎所以古之人當其血氣壯盛之時慮光陰之易往則朝念夕思戒謹彌懼不恣情不逸欲惟道是求遂能全其令聞若夫隳之以逸慾敗之以恣情殆於不可捄方頓足扼腕而追之晚矣時乎難得而易失也薌林書震上離下豐亨雷火豐卦豐者大也以明而動盛大之勢也故其占有亨道焉然盛極將衰又有憂道焉聖人以為徒憂無益但守常不至過盛彖辭云日中則月盈則食天地盈虗與時消息而況人乎況于鬼神乎葢言豐盛難常以此為戒也日中盛極則當昧月盈極則有虧缺天地之盈虧尚隨時消息況人生于天地之間鬼神為天地之氣機豐盛之時以此為戒欲人守中不至於過盛也處豐之道豈容易哉消息陰死為消陽死為息令聞上善也下去聲名遠達也時乎難得夫功難成而易敗時難得而易失謂時乎時乎不再來漢蒯徹說韓信之言也妙喜曰古人先擇道德次推才學而進當時苟非良器置身于人前者見聞多薄之由是衲子自思砥礪名節而立比見叢林凋喪學者不顧道德少節義無廉耻譏淳素為鄙朴獎囂浮為俊敏是故晚輩識見不明涉獵抄寫用資口舌之辯日滋月浸遂成澆漓之風逮語于聖人之道瞢若面牆此殆不可捄也與韓子蒼書砥礪琢磨也涉獵謂之泛覧流觀音如涉水獵獸意不精專終不克見深奧之旨也面牆論語云子謂伯魚曰女為周南召南矣乎人而不為周南召南猶面牆而立也歟言其一物無所見一步不可行也妙喜曰昔晦堂作黃龍題名記曰古之學者居則巖穴食則土木衣則皮草不係心於聲利不籍名於官府自魏晉齊梁隋唐以來始剏招提聚四方學徒擇賢者規不肖俾智者導愚迷由是賓主立上下分矣夫四海之眾聚于一寺當其任者誠亦難能要在總其大捨其小先其急後其緩不為私計專利於人此汲汲為一身之謀者實霄壤矣今黃龍以歷代住持題其名于石使後之來者見而目之曰孰道德孰仁義孰公于眾孰利於身嗚呼可不懼乎石刻籍名但身離塵世跡寄烟霞故有司文籍不得著其名也剏楚浪切初造也汲汲小人為利而無少暇張侍郎子韶謂妙喜曰夫禪林首座之職乃選賢之位今諸方不問賢不肖例以此為僥倖之津途亦主法者失也然則像季固難得其人若擇其履行稍優才德稍備識廉耻節義者居之與夫險進之徒亦差勝矣可菴集津途渡水處曰津陸行處曰途妙喜謂子韶曰近代主法者無如真如喆善輔弼叢林莫若楊岐議者謂慈明真率作事忽略殊無避忌楊岐忘身事之惟恐不周惟慮不辦雖衝寒暑未甞急己惰容始自南源終于興化僅三十載總柄綱律盡慈明之世而後已如真如者初自束包行脚逮于應世領徒為法忘軀不啻如饑渴者造次顛沛不遽色無疾言夏不排窻冬不附火一室翛然凝塵滿案甞曰衲子內無高明遠見外乏巖師良友尠克有成器者故當時執抝如孚鐵脚倔強如秀圓通諸公皆望風而偃嗟乎二老實千載衲子之龜鑑也可菴記聞輔弼扶助也如朝廷有股肱之臣則天下治叢林有賢智衲僧則法門興也衝寒下謂隆冬盛暑之時或執勞則踴躍以身先之未甞有懶惰之容現於顏面也始自南源楊大年以書抵宜春太守黃守旦使請師出世說法守以南源致請後謁神鼎鼎嘆曰汾陽有此兒耶師自此名重四方定林沙門本延有道行雅為士大夫敬信見鼎稱讚慈明知見可興臨濟之道時道吾虗席延白郡守請以主之法令整肅忘軀為眾後遷石霜又居福巖又住興化總柄綱律統束也謂統束叢林權衡僧任立綱陳紀整頓規繩救時之弊也為法下惟知有佛法而不知有其身也造次急遽苟且之時顛沛傾覆流離之際遽勃然而變其色也疾也抝剛硬孤高不近人情孚鐵脚長蘆應天永孚禪師嗣泐潭懷澄其遊方至一旅邸有娼女所逼不惑女告母母嘆曰真佛子也故叢林云平生孚鐵脚道價喧宇宙偃仆也倒也論語孔子曰君子之德風小人之德草草上之風必偃龜鑑龜知未來之禍福鑑照現在之妍𡟎子韶同妙喜萬菴三人詣前堂本首座寮問疾妙喜曰林下人身安然後可以學道萬菴直謂不然必欲學道不當更顧其身妙喜曰爾遮漢又顛邪子韶雖重妙喜之言而終愛萬菴之語為當記聞本首座即博山悟本也當去聲發言之中節也子韶問妙喜方今住持何先妙喜曰安著禪和子不過錢糓而已時萬菴在座以謂不然計常住所得善能撙節浮費用之有道錢糓不勝數矣何足為慮然當今住持惟得抱道衲子為先假使住持有智謀能儲十年之糧座下無抱道衲子先聖所謂坐消信施仰愧龍天何補住持子韶曰首座所言極當妙喜回顧萬菴曰一個個都似你萬菴休去已上並見可菴集撙節量其所入度其所出節儉廉約無使奢侈儲積聚也嗣也如太子嗣君故謂之儲萬菴顏和尚曰妙喜先師初住徑山因夜參持論諸方及曹洞宗旨不已次日音首座謂先師曰夫出世利生素非細事必欲扶振宗教當隨時以捄弊不必取目前之快和尚前日作禪和子持論諸方猶不可妄況今登寶華王座稱善知識耶先師曰夜來一時之說焉首座曰聖賢之學本於天性豈可率然先師稽首謝之首座猶說之不已萬菴曰先師竄衡陽賢侍者錄貶詞揭示僧堂前衲子如失父母涕泗愁歎居不遑處音首座詣眾寮白之曰人生禍患不可苟免使妙喜平生如婦人女子陸沈下板緘默不言故無今日之事況先聖所應為者不止於是爾等何苦自傷昔慈明瑯瑘谷泉大愚結伴參汾陽適當西北用兵遂易衣混火隊中往今徑山衡陽相去不遠道路絕間關山川無險阻要見妙喜復何難乎由是一眾寂然翌日相繼而去廬山智林集曹洞宗曹乃撫州曹山本寂禪師嗣洞山良介禪師初離洞山入曹溪禮祖塔回吉州之吉水眾響山名遂請開法師擬曹溪凡隨所居處立曹為號洞山之宗至師最隆故稱曹洞宗也率然輕忽也衡陽湖南道衡州府衡陽縣也揭高舉也張示也涕泗目出汁曰涕鼻出汁曰泗遑處居處不安之貌又急也婦女但有閨門之志而無境外之心下板官謂下僚下板言居于下位也谷泉南嶽芭蕉菴大道谷泉禪師泉州人嗣汾陽善昭禪師南嶽下十世也大愚瑞州大愚山守芝禪師嗣汾陽汾陽汾州太子院善昭禪師太原俞氏子嗣首山念禪師南嶽下九世也混火隊中汾陽道望天下慈明等決志親謁當時河東澤潞皆屯兵眾皆無行惟公等不顧危阻渡河登太行山易衣混軍隊中露眠草宿不辭勞苦遂造汾陽參見詳見僧寶傳萬菴曰先師移梅陽衲子間有竊議者音首座曰大凡評論於人當於有過中求無過詎可於無過中求有過夫不察其心而疑其跡誠何以慰叢林公論且妙喜道德才器出於天性立身行事惟義是從其量度固過於人今造物抑之必有道矣安得不知其為法門異時之福耶聞者自此不復議論矣智林集移梅陽即廣東潮州府梅陽縣也侍郎張九成未第時因談楊文公呂微仲諸儒所造精妙皆由學禪而至於是慕禪學聞寶印楚明禪師道風敬往參請師舉柏樹子話令時時提撕一日聞蛙鳴釋然契入有偈曰春天月下一聲蛙撞破乾坤共一家正恁麼時誰會得嶺頭脚痛有玄沙宋高宗紹興七年七月十一日詔妙喜住徑山能仁寺至紹興十一年張九成與諸大夫輩往謁評議格物話妙喜曰公祇知有格物不知有物格諸公茫然妙喜大笑公曰師能開諭乎喜曰不見小說載唐人與安祿山叛者其人先為閬州守有𦘕像在焉時唐明皇幸蜀見之怒令使臣以劍擊之像首落時閬州守隱居陝西首忽然墮地公聞頓領深旨呈偈題於軒壁曰子韶格物妙喜物格欲識一貫兩個五百妙喜重其悟入時為上堂引神臂弓一發透過千層甲老僧拈來看直甚臭皮襪之句是時軍國邊事方議神臂弓之用右相秦檜以為譏議朝政五月民佛日竄衡陽貶九成為南康軍妙喜紹興七年住徑山十一年五月內貶衡陽著正法眼藏三帙被人重譖復貶梅陽未幾詔復形服時四方虗席以邀不就紹興二十年十一月詔住明州阿育王寺二十八年再詔住徑山孝宗隆興元年八月初一日示寂宋時自秦檜專國士大夫名望者悉屏之遠方齷齪委靡不振之徒一言契合即登正府仍止除一廳謂之伴拜稍出一言斥而去之不異奴隷也音首座謂萬菴曰夫稱善知識當洗濯其心以至公至正接納四來其間有抱道德仁義者雖有讎隙必須進之其或姦邪險薄者雖有私恩必須遠之使來者各知所守一心同德而叢林安矣與妙喜書又曰凡住持者孰不欲建立叢林而鮮能克振者以其忘道德廢仁義捨法度任私情而致然也誠念法門凋喪當正己以下人選賢以佐佑推獎宿德疎遠小人節儉修於身德惠及於人然後所用執侍之人稍近老成者存之便者疎之貴無醜惡之謗偏黨之亂也如此則馬祖百丈可侔臨濟德山可逮智林集侔齊也臨濟鎮州臨濟院義玄禪師曹州南華邢氏子嗣黃檗希運禪師南嶽下四世德山鼎州德山宣鑑禪師簡州周氏子嗣龍潭崇信禪師南嶽下四世也音首座曰古之聖人以無災為懼乃曰天豈弃不糓乎范文子曰惟聖人能內外無患自非聖人外寧必內憂古今賢達知其不能免甞謹其始為之自防是故人生稍有憂勞未必不為終身之福葢禍患謗辱雖堯舜不可逃況其他乎與妙喜書古之聖人司馬光曰楚莊以無災為懼曰天豈棄不糓乎不糓不善人也亦是謙詞謗辱堯有不慈之心舜有不孝之過堯舜翊善傳聖曰堯仁盛聖明曰萬菴顏和尚曰比見叢林絕無老成之士所至三百五百一人為主多人為伴據法王位拈槌豎拂互相欺誑縱有談說不涉典章宜其無老成人也夫出世利生代佛揚化非明心達本行解相應詎敢為之譬如有人妄號帝王自取誅滅況復法王如何妄竊烏乎去聖逾遠水潦鶴之屬又復縱橫使先聖化門日就淪溺吾欲無言可乎屬菴居無事條陳傷風敗教為害甚者一二流布叢林俾後生晚進知前輩兢兢業業以荷負大法為心如氷凌上行劍刃上走非苟名利也知我罪我吾無辭焉智林集不涉典章孟浪之談取笑傍觀也作事輕率曰孟浪妄號帝王楞嚴經云譬如有人妄號帝王自取誅滅況復法王如何妄竊也今謂未得謂得未證謂證妄稱有道欺罔聾俗切取聲利以自斷送詎可救乎葢聖賢貴真正難聞豈凡夫而可妄稱哉水潦鶴阿難至竹林中聞有比丘誦法偈曰若人生百歲不見水潦鶴不如生一日而得覩見之阿難聞已慘然歎曰世間眼滅何其速乎煩惱諸惡如何便起違返聖教自生妄滅無有慧明常處癡暗永當流轉生死便語比丘此非佛語不可修行汝今當知二人謗佛一雖多聞而生邪見二解深義顛倒妄說有此二法為自毀傷不能令人離三惡道汝今當聽我演佛偈若人生百歲不解生滅法不如生一日而得解了知爾時比丘即向其師而告之師曰阿難老朽言多錯謬不可信矣汝今當依前偈而誦阿難後聞比丘復誦前偈問其故答言吾師告我阿難老朽言多虗妄汝可依前而誦阿難思惟彼輕我言或受餘教即入三昧推求勝德不見有能回挽彼意作是念言異哉異哉不復正也當墮三塗文出阿育王傳屬菴上音祝值遇也條陳上目也下設也謂布列條章陳設法度以救末法之弊也兢業兢競戒謹也履薄氷而懼陷業業恐懼也蹈劍刃而恐傷知我孔子作春秋以寓王法其大要皆天子之事知孔子者謂此書之作遏人欲於橫流存天理於既滅為後世慮至深遠也罪我罪孔子者以謂無其位而托二百四十二年南面之權使亂臣賊子禁其欲而不敢肆則慽矣萬菴曰古人上堂先提大法綱要審問大眾學者出來請益遂形問答今人杜撰四句落韻詩喚作釣話一人突出眾前高吟古詩一聯喚作罵陣俗惡俗惡可悲可痛前輩念生死事大對眾決疑既以發明未起生滅心也杜撰上塞也下造也述也言不通古法而自造也如杜光庭假佛經而作道經也萬菴曰夫名行尊宿至院主人陞座當謙恭敘謝屈尊就卑增重之語下座同首座大眾請陞于座庶聞法要多見近時相尚舉古人公案令對眾批判喚作驗他切莫萌此心先聖為法忘情同建法化互相詶唱令法久住肯容心生滅興此惡念耶禮以謙為主宜深思之萬菴曰比見士大夫監司郡守入山有處次日令侍者取覆長老今日特為某官陞座此一節猶宜三思然古來方冊中雖載皆是士大夫訪尋知識而來住持人因參次略提外護教門光輝泉石之意既是家裏人說家裏兩三句淡話令彼生敬如郭公輔楊次公訪白雲蘇東坡黃太史見佛印便是樣子也豈是特地妄為取笑識者方冊以竹為紙書載典章合而成帙曰方冊東坡見佛印佛印了元禪師一日與學徒坐次東坡詣金山值佛印入室師云此間無坐處坡云借師四大作禪床師云老僧有一問道得即坐道不得即輸腰間玉帶坡即解帶置案云請師問師云老僧四大本空五陰非有汝向甚麼處坐坡無語印召侍者留下玉帶永鎮山門以衲衣酬之坡作賦云病骨難堪玉帶圍鈍根仍落箭鋒機會當乞食歌姬院換得雲山舊衲衣萬菴曰古人入室先令挂牌各人為生死事大踊躍來求決擇多見近時無問老病盡令來納降欵有麝自然香安用公界驅之因此妄生節目賓主不安主法者當思之決擇決擇深奧啟悟真源降欵輸誠盡敬之貌萬菴曰少林初祖衣法雙傳六世衣止不傳取行解相應世其家業祖道愈光子孫益繁大鑑之後石頭馬祖皆嫡孫應般若多羅懸讖要假兒孫脚下行是也二大士玄言妙語流布寰區潛符密證者比比有之師法既眾學無專門曹溪源流派別為五方圓任器水體是同各擅佳聲力行己任等閒垂一言出一令網羅學者叢林鼎沸非苟然也由是互相詶唱顯微闡幽或抑或揚佐佑法化語言無味如煑木札羮炊鐵釘飯與後輩咬嚼目為拈古其頌始自汾陽暨雪竇宏其音顯其旨汪洋乎不可涯後之作者馳騁雪竇而為之不顧道德之奚若務以文彩煥爛相鮮為美使後生晚進不克見古人渾淳大全之旨烏乎予遊叢林及見前輩非古人語錄不看非百丈號令不行豈特好古葢今之人不足法也望通人達士知我於言外可矣懸讖上遠也下將來之事也達磨大師得法後問般若多羅云當往何國而作佛事師曰汝雖得法未可遠行且止南天待吾滅後六十七歲當往震旦說大法藥直接上根慎勿遠行衰于日下又問彼有大士堪為法器否千載之下有留難否師曰汝之所化獲菩提者不可勝數吾滅度後六十七載彼國有難水中文布善自降之汝至時勿住彼國唯好有為功德不見佛理聽吾偈曰路行跨水復逢羊獨自悽悽暗渡江日下可憐雙像馬二株嫩桂久昌昌又云一百五十年有小難聽吾偈曰心中雖吉外頭凶川下僧房名不中若有毒龍生武子忽逢小鼠寂無窮又曰却後林下見一人當得道果聽吾偈曰震旦雖濶無別路要假兒孫脚下行金雞解啣一粒粟供養十方羅漢僧謂首句即道一也次句乃石頭也第三句即南嶽讓讓乃金雞縣人第四句頌馬祖祖是四川什邡縣羅漢寺僧嗣南嶽之法故爾謂達磨懸讖石頭南嶽為曹洞臨濟之宗祖也密證明教曰密也者非不言而暗證也真密也註外傳信衣內授密證乃吾佛祖真實秘密之法也比每也往也顯微下謂妙音幽微玄宗淵奧語言文字有所不能形容矣故至理絕言非言可及雖云道本無言非言不顯謂真心離相即諸相而顯真心至理絕言假微言而昭彰至道也抑揚縱奪之義炊音吹㸑也雪竇明州雪竇重顯禪師遂州李氏子嗣智門光祚禪師一日示眾云三分光陰二早過靈臺一點不揩磨貪生逐日區區走喚不回頭怎奈何汪洋廣有之貌渾淳清濁未分也萬菴曰比見衲子好執偏見不通物倩輕信難迴愛人己順之則美逆之則疎縱有一知半解返被此等惡習所蔽至白首而無成者多矣已上並見智林集萬菴曰叢林所至邪說熾然乃云戒律不必持定慧不必習道德不必修嗜慾不必去又引維摩圓覺為證贊貪瞋癡殺盜淫為梵行烏乎斯言豈特起叢林今日之害真法門萬世之害也且博地凡夫貪瞋愛慾人我無明念念攀緣如一鼎之沸何由清冷先聖必思大有於此者遂設戒定慧三學以制之庶可迴也今後生晚進戒律不持定慧不習道德不修專以博學強辯搖動流俗牽之莫返予固所謂斯言乃萬世之害也惟正因行脚高士當以生死一著辨明持誠存信不為此輩牽引乃曰此言不可信猶鴆毒之糞虵飲之水聞見猶不可況食之乎其殺人無疑矣識者自然遠之矣與草書堂維摩經云大乘菩薩入諸淫舍示欲之過雖有妻子常修梵行圓覺經云一切障礙即究竟覺乃至諸戒定慧及淫怒癡俱為梵行此大權聖人示跡利生而外道邪人以此誑人濫膺恭敬貪瞋癡引取無厭曰貪又愛欲也由愛心計著而發也怒心之盛曰瞋又剛烈也由心氣相作而發也然心屬火氣屬金心火轉氣金轉剛故也迷惑無知曰癡又愚昧也由輕慢恃己而發也火天大有卦所有之大也火在天上無物不照故聖人有大作為非凡可比也特為凡夫興大慈心作大利益遂設戒定慧三學戒定慧防非止惡曰戒止息諸緣曰定破惑證真曰慧此三者入道之門泥洹之要凡為僧者於此宜盡心焉萬菴曰草堂弟子惟山堂有古人之風住黃龍日知事公幹必具威儀詣方丈受曲折然後備茶湯禮始終不易有智恩上座為母修冥福透下金二錢兩日不尋聖僧才侍者因掃地而得之挂拾遺牌一眾方知葢主法者清淨所以上行下效也清泉集曲折聽分付發放也拾遺牌古者叢林凡興佛事必須挂牌曉諭大眾今挂拾遺者類餘也萬菴節儉以小參普說當供衲子間有竊議者萬菴聞之曰朝饗膏粱暮厭麤糲人之常情汝等既念生死事大而相求於寂寞之濵當思道業未辦去聖時遙詎可朝夕事貪饕耶真牧集小參禪門話早旦陞堂曰早參日晡時念誦曰晚參隨時說法曰小參普參者凡聖皆集緇素咸臻主法者以等心應物垂示萬機令法久住矣或小參乃家訓也訓誨學者之規範也糲米不精也萬菴天性仁厚處躬廉約尋常出示語句辭簡而義精博學強記窮詰道理不為苟止而妄隨與人評論古今若身履其間聽者曉然如目覩衲子甞曰終歲參學不若一日聽師談論為得也記聞萬菴謂辯首座曰圓悟師翁有言今時禪和子少節義勿廉耻士大夫多薄之爾異時儻不免做遮般蟲豸常常在繩墨上行勿趨勢利人顏色生死禍患一切任之即是不出魔界而入佛界也法語辯首座都府昭覺寺辯禪師嗣大溈法泰禪師儻或然之辭蟲豸有足曰蟲無足曰豸繩墨規矩也木隨繩墨而正直心隨教化而離邪凡行道德興教化不可須臾忘也辯首座出世住廬山棲賢常携一笻穿雙屨過九江東林混融老見之呵曰師者人之模範也舉止如此得不自輕主禮甚滅裂辯笑曰人生以適意為樂吾何咎焉援毫書偈而去偈曰勿謂棲賢窮身窮道不窮草鞋獰似虎拄杖活如龍渴飲曹溪水饑吞栗棘蓬銅頭鐵額漢盡在我山中混融覧之有媿月窟集笻竹杖也屨音巨草屨也適稱也獰惡也栗棘蓬楊岐示眾云透得金剛圈吞得栗棘蓬便與三世諸佛把手共行歷代祖師共一鼻孔其或未然參須實參悟須實悟者也辯公謂混融曰像龍不足致雨畵餅安可充饑衲子內無實德外恃華巧猶如敗漏之船盛塗丹雘使偶人駕之安於陸地則信然可觀矣一旦涉江湖犯風濤得不危乎月窟集辯公曰所謂長老者代佛揚化要在潔己臨眾行事當盡其誠豈可擇利害自分其心在我為之固當如是若其成與不成雖先聖不能必吾何苟乎月窟集辯公曰佛智住西禪衲子務要整齊惟水菴賦性冲澹奉身至薄昂昂然在稠人中曾不屑慮佛智因見之呵曰奈何䖃苴如此水菴對曰某非不好受用直以貧無可為之具若使有錢亦欲做一兩件皮毛同入社火既貧固無如之何佛智笑之意其不可強遂休去月窟集佛智慶元府育王寺佛智端裕禪師吳越王之裔也嗣圓悟勤禪師水菴臨安府淨慈水菴端一禪師婺州馬氏子嗣佛智裕禪師南嶽下十六世冲澹上和也下恬靜也昂孤高自如之貌屑輕苟也又顧也䖃苴上郎假切下音鮓中州人謂蜀人不遵軌轍曰䖃苴又苴不熟之貌也社火俗呼會伴也音切㳂余穿切廡無禹切煨烏回切燼詳進切潸所班切惓巨卷切浹子恊切倨九魚切慘倉感切怛丁割切詬胡遘切懥陟利切憤扶粉切悱孚匪切𮭠其愚切頷戶感切蠒古典切慽且的切尠息淺切抝烏狡切倔巨勿切撙祖本切汾扶云切鴆除禁切糲力葛切䖃藥音苴七閭切
